<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arduino Pong — Horizontal Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 min-h-screen overflow-hidden bg-[#090b10] font-mono text-white">
  <main class="flex min-h-screen flex-col items-center justify-center gap-3 p-3">
    <div class="flex w-[min(94vw,820px)] flex-wrap items-center justify-between gap-3">
      <div>
        <p class="text-xs font-bold uppercase tracking-[0.26em] text-cyan-300">Potentiometer Pong</p>
        <h1 class="text-xl font-black">BOTTOM VS TOP</h1>
      </div>
      <button id="connectBtn" class="rounded-xl bg-cyan-300 px-5 py-3 text-sm font-black text-slate-950 shadow-lg shadow-cyan-300/20 transition hover:bg-white">
        CONNECT ARDUINO NANO
      </button>
    </div>

    <canvas id="gameCanvas" width="800" height="540" class="block h-auto max-h-[76vh] w-[min(94vw,800px)] rounded-xl border-4 border-white bg-[#111318] shadow-2xl shadow-cyan-400/10"></canvas>

    <div class="flex w-[min(94vw,820px)] flex-wrap items-center justify-between gap-2 text-xs text-slate-300">
      <span>Potentiometer or ← → moves your bottom paddle</span>
      <span id="serialStatus" class="font-bold text-amber-300">Arduino offline</span>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const connectBtn = document.getElementById('connectBtn');
    const serialStatus = document.getElementById('serialStatus');

    const paddleWidth = 120;
    const paddleHeight = 16;
    const playerY = canvas.height - 34;
    const enemyY = 18;

    let playerX = (canvas.width - paddleWidth) / 2;
    let enemyX = (canvas.width - paddleWidth) / 2;
    let ballX = canvas.width / 2;
    let ballY = canvas.height / 2;
    let ballSpeedX = 3.4;
    let ballSpeedY = 5;
    let score = 0;
    let bestScore = 0;
    let potentiometerRaw = 512;
    let serialConnected = false;
    const keys = new Set();

    addEventListener('keydown', (event) => {
      if (['ArrowLeft', 'ArrowRight'].includes(event.code)) event.preventDefault();
      keys.add(event.code);
    });
    addEventListener('keyup', (event) => keys.delete(event.code));

    function playTone(frequency, duration) {
      try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = 'square';
        oscillator.frequency.value = frequency;
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        gain.gain.setValueAtTime(0.08, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration);
      } catch (_) {}
    }

    async function connectArduino() {
      if (!('serial' in navigator)) {
        alert('Use desktop Chrome or Edge through HTTPS or localhost for Web Serial.');
        return;
      }

      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        serialConnected = true;
        serialStatus.textContent = 'Arduino connected';
        serialStatus.className = 'font-bold text-emerald-300';
        connectBtn.textContent = 'ARDUINO CONNECTED';
        connectBtn.disabled = true;
        connectBtn.classList.add('opacity-70');

        const decoder = new TextDecoderStream();
        port.readable.pipeTo(decoder.writable).catch(() => {});
        const reader = decoder.readable.getReader();
        let buffer = '';

        while (serialConnected) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop() || '';

          for (const line of lines) {
            const parsed = Number.parseInt(line.trim(), 10);
            if (!Number.isNaN(parsed)) {
              potentiometerRaw = Math.max(0, Math.min(1023, parsed));
              playerX = (potentiometerRaw / 1023) * (canvas.width - paddleWidth);
            }
          }
        }
      } catch (error) {
        serialConnected = false;
        serialStatus.textContent = 'Connection failed';
        serialStatus.className = 'font-bold text-red-300';
        connectBtn.disabled = false;
        connectBtn.textContent = 'RETRY ARDUINO CONNECTION';
        alert(`Serial connection failed: ${error.message}`);
      }
    }
    connectBtn.addEventListener('click', connectArduino);

    function resetBall(towardPlayer = true) {
      ballX = canvas.width / 2;
      ballY = canvas.height / 2;
      ballSpeedX = (Math.random() > 0.5 ? 1 : -1) * (3.2 + Math.min(score * 0.15, 3));
      ballSpeedY = (towardPlayer ? 1 : -1) * (5 + Math.min(score * 0.22, 4));
    }

    function paddleCollision(paddleX, paddleY, isPlayer) {
      const radius = 10;
      const touchingX = ballX + radius >= paddleX && ballX - radius <= paddleX + paddleWidth;
      const touchingY = ballY + radius >= paddleY && ballY - radius <= paddleY + paddleHeight;
      if (!touchingX || !touchingY) return false;

      const hitPosition = (ballX - (paddleX + paddleWidth / 2)) / (paddleWidth / 2);
      ballSpeedX = hitPosition * (5.5 + Math.min(score * 0.2, 4));
      ballSpeedY = isPlayer ? -Math.abs(ballSpeedY) : Math.abs(ballSpeedY);
      ballY = isPlayer ? paddleY - radius - 1 : paddleY + paddleHeight + radius + 1;
      return true;
    }

    function update() {
      if (!serialConnected) {
        const keyboardDirection = (keys.has('ArrowLeft') ? -1 : 0) + (keys.has('ArrowRight') ? 1 : 0);
        playerX += keyboardDirection * 8;
      }
      playerX = Math.max(0, Math.min(canvas.width - paddleWidth, playerX));

      ballX += ballSpeedX;
      ballY += ballSpeedY;

      const enemyTarget = ballX - paddleWidth / 2;
      const enemySpeed = Math.min(4 + score * 0.24, 10.5);
      if (enemyX < enemyTarget) enemyX += enemySpeed;
      if (enemyX > enemyTarget) enemyX -= enemySpeed;
      enemyX = Math.max(0, Math.min(canvas.width - paddleWidth, enemyX));

      if (ballX <= 10 || ballX >= canvas.width - 10) {
        ballSpeedX *= -1;
        ballX = Math.max(10, Math.min(canvas.width - 10, ballX));
        playTone(220, 0.05);
      }

      if (ballSpeedY > 0 && paddleCollision(playerX, playerY, true)) {
        score++;
        bestScore = Math.max(bestScore, score);
        ballSpeedY = -Math.min(Math.abs(ballSpeedY) + 0.18, 10);
        playTone(580, 0.08);
      }

      if (ballSpeedY < 0 && paddleCollision(enemyX, enemyY, false)) {
        playTone(340, 0.07);
      }

      if (ballY < -20) {
        score += 2;
        bestScore = Math.max(bestScore, score);
        playTone(880, 0.2);
        resetBall(true);
      }

      if (ballY > canvas.height + 20) {
        playTone(130, 0.35);
        score = 0;
        resetBall(true);
      }
    }

    function drawCourt() {
      ctx.fillStyle = 'rgba(17, 19, 24, 0.38)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.setLineDash([10, 12]);
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#00ffcc';
      ctx.fillRect(enemyX, enemyY, paddleWidth, paddleHeight);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(playerX, playerY, paddleWidth, paddleHeight);

      ctx.fillStyle = '#ff0055';
      ctx.beginPath();
      ctx.arc(ballX, ballY, 10, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = "bold 18px 'Courier New'";
      ctx.fillText(`SCORE: ${score}`, 24, canvas.height / 2 - 20);
      ctx.fillText(`BEST: ${bestScore}`, canvas.width - 140, canvas.height / 2 - 20);
      ctx.fillStyle = '#00ffcc';
      ctx.fillText('ENEMY', 24, 62);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('YOU', 24, canvas.height - 58);

      if (serialConnected) {
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.font = "14px 'Courier New'";
        ctx.fillText(`POT: ${potentiometerRaw}`, canvas.width - 116, canvas.height - 58);
      }
    }

    function gameLoop() {
      update();
      drawCourt();
      requestAnimationFrame(gameLoop);
    }

    resetBall(true);
    gameLoop();
  </script>
</body>
</html>
