<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Potentiometer City Driver</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 overflow-hidden bg-sky-200 font-mono text-white">
  <div id="hud" class="pointer-events-none fixed inset-0 z-20">
    <section class="pointer-events-auto absolute left-4 top-4 w-[min(92vw,390px)] rounded-2xl border border-white/20 bg-slate-950/80 p-4 shadow-2xl backdrop-blur-xl">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p class="text-[10px] font-bold uppercase tracking-[0.28em] text-cyan-300">Three.js + Cannon physics</p>
          <h1 class="mt-1 text-xl font-black">CITY DRIVER</h1>
        </div>
        <div id="speed" class="min-w-24 rounded-xl bg-white/10 px-3 py-2 text-right text-sm font-black">0 km/h</div>
      </div>

      <div class="mt-4 grid grid-cols-3 gap-2 text-xs">
        <div class="rounded-xl bg-white/5 p-2">
          <span class="block text-slate-400">Steering</span>
          <span id="steeringValue" class="font-bold text-cyan-300">Keyboard</span>
        </div>
        <div class="rounded-xl bg-white/5 p-2">
          <span class="block text-slate-400">Arduino</span>
          <span id="serialStatus" class="font-bold text-amber-300">Offline</span>
        </div>
        <div class="rounded-xl bg-white/5 p-2">
          <span class="block text-slate-400">Physics</span>
          <span class="font-bold text-emerald-300">Active</span>
        </div>
      </div>

      <button id="connectBtn" class="mt-3 w-full rounded-xl bg-cyan-300 px-4 py-3 text-sm font-black text-slate-950 shadow-lg shadow-cyan-300/20 transition hover:bg-white">
        CONNECT ARDUINO NANO
      </button>

      <div class="mt-3 grid grid-cols-2 gap-2 text-[11px] text-slate-300">
        <div class="rounded-lg border border-white/10 p-2">↑ Accelerate</div>
        <div class="rounded-lg border border-white/10 p-2">↓ Brake / reverse</div>
        <div class="rounded-lg border border-white/10 p-2">← → Steering</div>
        <div class="rounded-lg border border-white/10 p-2">Space Handbrake</div>
        <div class="col-span-2 rounded-lg border border-white/10 p-2 text-center">R Reset vehicle</div>
      </div>
    </section>

    <div id="impact" class="absolute left-1/2 top-24 hidden -translate-x-1/2 rounded-full border border-red-300/40 bg-red-950/80 px-5 py-2 text-sm font-black text-red-200 shadow-xl backdrop-blur-md">
      IMPACT
    </div>

    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 rounded-full border border-white/20 bg-slate-950/75 px-5 py-2 text-center text-xs text-slate-200 backdrop-blur-md">
      Cross the bridge, follow traffic, and explore the waterfall district.
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js';
    import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const randomRange = (min, max) => min + Math.random() * (max - min);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ed8ff);
    scene.fog = new THREE.FogExp2(0xa8d8ee, 0.00125);

    const camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, 0.1, 2600);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.domElement.className = 'fixed inset-0 block';
    document.body.prepend(renderer.domElement);

    const ambient = new THREE.HemisphereLight(0xe8f7ff, 0x34592d, 2.2);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xfff3d3, 4.2);
    sun.position.set(-180, 260, -140);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -420;
    sun.shadow.camera.right = 420;
    sun.shadow.camera.top = 420;
    sun.shadow.camera.bottom = -420;
    sun.shadow.camera.near = 20;
    sun.shadow.camera.far = 700;
    scene.add(sun);

    const physicsWorld = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
    physicsWorld.broadphase = new CANNON.SAPBroadphase(physicsWorld);
    physicsWorld.allowSleep = true;
    physicsWorld.solver.iterations = 12;
    physicsWorld.defaultContactMaterial.friction = 0.42;
    physicsWorld.defaultContactMaterial.restitution = 0.05;

    const asphaltPhysicsMaterial = new CANNON.Material('asphalt');
    const tyrePhysicsMaterial = new CANNON.Material('tyre');
    physicsWorld.addContactMaterial(new CANNON.ContactMaterial(asphaltPhysicsMaterial, tyrePhysicsMaterial, {
      friction: 0.9,
      restitution: 0,
      contactEquationStiffness: 1e7
    }));

    const worldVisual = new THREE.Group();
    scene.add(worldVisual);

    const mats = {
      grass: new THREE.MeshStandardMaterial({ color: 0x4f9a48, roughness: 1 }),
      grassDark: new THREE.MeshStandardMaterial({ color: 0x357b39, roughness: 1 }),
      road: new THREE.MeshStandardMaterial({ color: 0x252b31, roughness: 0.94 }),
      sidewalk: new THREE.MeshStandardMaterial({ color: 0x9ba4aa, roughness: 0.9 }),
      concrete: new THREE.MeshStandardMaterial({ color: 0x707982, roughness: 0.85 }),
      bridge: new THREE.MeshStandardMaterial({ color: 0x59636d, roughness: 0.8 }),
      rail: new THREE.MeshStandardMaterial({ color: 0xd9e2e8, metalness: 0.55, roughness: 0.35 }),
      rock: new THREE.MeshStandardMaterial({ color: 0x575d5b, roughness: 1 }),
      trunk: new THREE.MeshStandardMaterial({ color: 0x654326, roughness: 1 }),
      leaf: new THREE.MeshStandardMaterial({ color: 0x276f3c, roughness: 1 }),
      line: new THREE.MeshStandardMaterial({ color: 0xf7e56c, roughness: 0.75 }),
      whiteLine: new THREE.MeshStandardMaterial({ color: 0xf5f7f7, roughness: 0.75 })
    };

    function addMesh(geometry, material, position, rotation = new THREE.Euler()) {
      const object = new THREE.Mesh(geometry, material);
      object.position.copy(position);
      object.rotation.copy(rotation);
      object.castShadow = true;
      object.receiveShadow = true;
      worldVisual.add(object);
      return object;
    }

    function addStaticBox({ size, position, material, rotation = new THREE.Euler(), visible = true }) {
      let object = null;
      if (visible) {
        object = addMesh(
          new THREE.BoxGeometry(size.x, size.y, size.z),
          material,
          position,
          rotation
        );
      }

      const body = new CANNON.Body({ mass: 0, material: asphaltPhysicsMaterial });
      body.addShape(new CANNON.Box(new CANNON.Vec3(size.x / 2, size.y / 2, size.z / 2)));
      body.position.set(position.x, position.y, position.z);
      body.quaternion.setFromEuler(rotation.x, rotation.y, rotation.z, 'XYZ');
      physicsWorld.addBody(body);
      return { object, body };
    }

    function addStaticSphere(radius, position, material, scale = new THREE.Vector3(1, 1, 1)) {
      const object = addMesh(new THREE.IcosahedronGeometry(radius, 2), material, position);
      object.scale.copy(scale);
      const body = new CANNON.Body({ mass: 0, material: asphaltPhysicsMaterial });
      body.addShape(new CANNON.Sphere(radius * Math.max(scale.x, scale.y, scale.z) * 0.82));
      body.position.set(position.x, position.y, position.z);
      physicsWorld.addBody(body);
      return { object, body };
    }

    // Two solid land masses leave a genuine river channel between them.
    addStaticBox({
      size: new THREE.Vector3(720, 8, 360),
      position: new THREE.Vector3(0, -4, -210),
      material: mats.grass
    });
    addStaticBox({
      size: new THREE.Vector3(720, 8, 360),
      position: new THREE.Vector3(0, -4, 210),
      material: mats.grass
    });

    // River bed catches vehicles that leave the bridge, while the water remains visibly below street level.
    addStaticBox({
      size: new THREE.Vector3(720, 2, 60),
      position: new THREE.Vector3(0, -8, 0),
      material: mats.rock
    });

    const roadWidth = 25;
    const sidewalkWidth = 5;

    function addRoadSegment(x, y, z, width, height, depth) {
      return addStaticBox({
        size: new THREE.Vector3(width, height, depth),
        position: new THREE.Vector3(x, y, z),
        material: mats.road
      });
    }

    addRoadSegment(0, 0.08, -205, roadWidth, 0.16, 350);
    addRoadSegment(0, 0.08, 205, roadWidth, 0.16, 350);
    addRoadSegment(0, 0.08, -120, 700, 0.16, roadWidth);
    addRoadSegment(0, 0.08, 120, 700, 0.16, roadWidth);

    // Sidewalks parallel to the main avenue.
    for (const side of [-1, 1]) {
      addStaticBox({
        size: new THREE.Vector3(sidewalkWidth, 0.34, 350),
        position: new THREE.Vector3(side * 16, 0.17, -205),
        material: mats.sidewalk
      });
      addStaticBox({
        size: new THREE.Vector3(sidewalkWidth, 0.34, 350),
        position: new THREE.Vector3(side * 16, 0.17, 205),
        material: mats.sidewalk
      });
    }

    // Cross-street sidewalks.
    for (const streetZ of [-120, 120]) {
      for (const side of [-1, 1]) {
        addStaticBox({
          size: new THREE.Vector3(700, 0.34, sidewalkWidth),
          position: new THREE.Vector3(0, 0.17, streetZ + side * 16),
          material: mats.sidewalk
        });
      }
    }

    // Raised bridge deck and sloped approach ramps.
    addStaticBox({
      size: new THREE.Vector3(29, 2.2, 64),
      position: new THREE.Vector3(0, 1.05, 0),
      material: mats.bridge
    });

    const rampAngle = 0.105;
    addStaticBox({
      size: new THREE.Vector3(29, 1.5, 24),
      position: new THREE.Vector3(0, 0.72, -43),
      rotation: new THREE.Euler(-rampAngle, 0, 0),
      material: mats.bridge
    });
    addStaticBox({
      size: new THREE.Vector3(29, 1.5, 24),
      position: new THREE.Vector3(0, 0.72, 43),
      rotation: new THREE.Euler(rampAngle, 0, 0),
      material: mats.bridge
    });

    // Bridge rails are real collision bodies.
    for (const side of [-1, 1]) {
      addStaticBox({
        size: new THREE.Vector3(0.65, 2.1, 86),
        position: new THREE.Vector3(side * 14.2, 3.05, 0),
        material: mats.rail
      });
    }

    // Lane markings.
    function addRoadMarking(x, y, z, width, depth, material = mats.line) {
      const mark = addMesh(new THREE.BoxGeometry(width, 0.035, depth), material, new THREE.Vector3(x, y, z));
      mark.castShadow = false;
      return mark;
    }

    for (let z = -360; z <= 360; z += 15) {
      if (Math.abs(z) < 60) continue;
      addRoadMarking(0, 0.2, z, 0.35, 7);
    }
    for (let x = -340; x <= 340; x += 15) {
      addRoadMarking(x, 0.2, -120, 7, 0.35);
      addRoadMarking(x, 0.2, 120, 7, 0.35);
    }
    for (let z = -27; z <= 27; z += 12) addRoadMarking(0, 2.22, z, 0.35, 6);

    // Animated river shader.
    const riverUniforms = { time: { value: 0 } };
    const riverMaterial = new THREE.ShaderMaterial({
      transparent: true,
      side: THREE.DoubleSide,
      uniforms: riverUniforms,
      vertexShader: `
        varying vec2 vUv;
        uniform float time;
        void main() {
          vUv = uv;
          vec3 p = position;
          p.z += sin((p.x * 0.06) + time * 1.8) * 0.35;
          p.z += sin((p.y * 0.12) - time * 1.1) * 0.18;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform float time;
        void main() {
          float ripple = sin(vUv.x * 90.0 + time * 3.0) * 0.5 + 0.5;
          float crossWave = sin(vUv.y * 38.0 - time * 2.1) * 0.5 + 0.5;
          vec3 deep = vec3(0.015, 0.20, 0.34);
          vec3 bright = vec3(0.08, 0.55, 0.72);
          vec3 colour = mix(deep, bright, ripple * 0.28 + crossWave * 0.22);
          float foam = smoothstep(0.82, 1.0, ripple * crossWave);
          colour += foam * 0.22;
          gl_FragColor = vec4(colour, 0.88);
        }
      `
    });
    const river = new THREE.Mesh(new THREE.PlaneGeometry(720, 58, 90, 18), riverMaterial);
    river.rotation.x = -Math.PI / 2;
    river.position.y = -2.25;
    river.receiveShadow = true;
    worldVisual.add(river);

    // Waterfall district at the western river edge.
    const waterfallUniforms = { time: { value: 0 } };
    const waterfallMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      uniforms: waterfallUniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform float time;
        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        void main() {
          float streakA = sin(vUv.x * 70.0 + sin(vUv.y * 16.0) - time * 9.0);
          float streakB = sin(vUv.x * 31.0 - vUv.y * 80.0 + time * 12.0);
          float noise = hash(floor(vec2(vUv.x * 34.0, (vUv.y - time * 0.8) * 60.0)));
          float edge = smoothstep(0.0, 0.12, vUv.x) * smoothstep(1.0, 0.88, vUv.x);
          float alpha = edge * (0.43 + 0.25 * streakA + 0.14 * streakB + noise * 0.25);
          vec3 water = mix(vec3(0.12, 0.48, 0.72), vec3(0.90, 0.98, 1.0), 0.55 + streakA * 0.24);
          gl_FragColor = vec4(water, clamp(alpha, 0.0, 0.82));
        }
      `
    });

    const waterfall = new THREE.Mesh(new THREE.PlaneGeometry(35, 34, 30, 40), waterfallMaterial);
    waterfall.rotation.y = Math.PI / 2;
    waterfall.position.set(-245, 12.5, 0);
    worldVisual.add(waterfall);

    const waterfallRear = waterfall.clone();
    waterfallRear.position.x -= 0.7;
    waterfallRear.scale.set(0.92, 1, 0.92);
    worldVisual.add(waterfallRear);

    // Cliff and rock collision around the waterfall.
    addStaticBox({
      size: new THREE.Vector3(22, 31, 80),
      position: new THREE.Vector3(-255, 7.5, 0),
      material: mats.rock
    });
    for (let i = 0; i < 14; i++) {
      const z = randomRange(-34, 34);
      const x = randomRange(-264, -238);
      const y = randomRange(-1, 24);
      addStaticSphere(randomRange(2.6, 6), new THREE.Vector3(x, y, z), mats.rock, new THREE.Vector3(1.2, 0.8, 1));
    }

    // Waterfall foam and mist particles.
    const particleCount = 420;
    const particlePositions = new Float32Array(particleCount * 3);
    const particleVelocity = [];
    for (let i = 0; i < particleCount; i++) {
      const i3 = i * 3;
      particlePositions[i3] = randomRange(-248, -238);
      particlePositions[i3 + 1] = randomRange(-2.5, 2.5);
      particlePositions[i3 + 2] = randomRange(-18, 18);
      particleVelocity.push(new THREE.Vector3(randomRange(-0.6, 1.8), randomRange(0.8, 4.4), randomRange(-1.7, 1.7)));
    }
    const foamGeometry = new THREE.BufferGeometry();
    foamGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const foamMaterial = new THREE.PointsMaterial({
      color: 0xeafcff,
      size: 1.25,
      transparent: true,
      opacity: 0.58,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const foamParticles = new THREE.Points(foamGeometry, foamMaterial);
    worldVisual.add(foamParticles);

    function updateFoam(dt) {
      const positions = foamGeometry.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const velocity = particleVelocity[i];
        positions[i3] += velocity.x * dt;
        positions[i3 + 1] += velocity.y * dt;
        positions[i3 + 2] += velocity.z * dt;
        velocity.y -= 2.6 * dt;
        if (positions[i3 + 1] < -2.8 || positions[i3] > -232) {
          positions[i3] = randomRange(-248, -241);
          positions[i3 + 1] = randomRange(-2.3, 0.8);
          positions[i3 + 2] = randomRange(-17, 17);
          velocity.set(randomRange(0.1, 2.0), randomRange(1.2, 4.8), randomRange(-1.8, 1.8));
        }
      }
      foamGeometry.attributes.position.needsUpdate = true;
    }

    // Procedural city building materials.
    function createWindowTexture(seedOffset = 0) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#18212b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let y = 8; y < 248; y += 16) {
        for (let x = 7; x < 122; x += 15) {
          const lit = Math.sin(x * 12.93 + y * 4.17 + seedOffset) > -0.22;
          ctx.fillStyle = lit ? (Math.random() > 0.32 ? '#f4d98f' : '#7dd8ff') : '#24313d';
          ctx.fillRect(x, y, 8, 9);
        }
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const buildingTextures = Array.from({ length: 6 }, (_, index) => createWindowTexture(index * 19));

    function addBuilding(x, z, width, depth, height, colour, textureIndex) {
      const texture = buildingTextures[textureIndex % buildingTextures.length];
      const material = new THREE.MeshStandardMaterial({
        color: colour,
        map: texture,
        emissive: new THREE.Color(0x203447),
        emissiveMap: texture,
        emissiveIntensity: 0.22,
        roughness: 0.72,
        metalness: 0.16
      });
      addStaticBox({
        size: new THREE.Vector3(width, height, depth),
        position: new THREE.Vector3(x, height / 2, z),
        material
      });

      const roof = addMesh(
        new THREE.BoxGeometry(width * 0.36, 2.5, depth * 0.34),
        mats.concrete,
        new THREE.Vector3(x, height + 1.25, z)
      );
      roof.castShadow = true;

      if (height > 70) {
        const antenna = addMesh(
          new THREE.CylinderGeometry(0.34, 0.6, randomRange(8, 16), 8),
          mats.rail,
          new THREE.Vector3(x, height + 8, z)
        );
        antenna.castShadow = true;
      }
    }

    const buildingPalette = [0x8593a6, 0x72879a, 0x7f756d, 0x66717b, 0x8f9ba3, 0x596b7c];
    const xBlocks = [-290, -235, -175, -115, -58, 58, 115, 175, 235, 290];
    const zBlocks = [-300, -245, -185, -65, 65, 185, 245, 300];
    let buildingIndex = 0;
    for (const x of xBlocks) {
      for (const z of zBlocks) {
        if (Math.abs(z + 120) < 32 || Math.abs(z - 120) < 32) continue;
        if (Math.abs(x) < 35) continue;
        if (Math.abs(z) < 42) continue;
        const width = randomRange(28, 43);
        const depth = randomRange(28, 44);
        const centreBoost = 1 - Math.min(1, Math.abs(x) / 330);
        const height = randomRange(28, 76) + centreBoost * randomRange(12, 68);
        addBuilding(x, z, width, depth, height, buildingPalette[buildingIndex % buildingPalette.length], buildingIndex);
        buildingIndex++;
      }
    }

    // Trees and rocks in green pockets; all large rocks are solid.
    function addTree(x, z, scale = 1) {
      addMesh(new THREE.CylinderGeometry(0.8 * scale, 1.1 * scale, 7 * scale, 9), mats.trunk, new THREE.Vector3(x, 3.5 * scale, z));
      const crown = addMesh(new THREE.IcosahedronGeometry(3.4 * scale, 1), mats.leaf, new THREE.Vector3(x, 8 * scale, z));
      crown.scale.y = 1.25;
    }

    for (let i = 0; i < 45; i++) {
      const bank = Math.random() > 0.5 ? 1 : -1;
      const x = randomRange(-330, 330);
      const z = bank * randomRange(38, 350);
      if (Math.abs(x) < 30 || Math.abs(z - 120) < 28 || Math.abs(z + 120) < 28) continue;
      if (Math.random() > 0.58) addTree(x, z, randomRange(0.7, 1.25));
    }

    const rockPositions = [
      [-82, -78, 4.2], [76, -72, 5.5], [-94, 82, 4.8], [95, 73, 5.2],
      [-150, -155, 4.4], [145, 165, 5.8], [-200, 75, 6.2], [210, -72, 5.5]
    ];
    for (const [x, z, radius] of rockPositions) {
      addStaticSphere(radius, new THREE.Vector3(x, radius * 0.72, z), mats.rock, new THREE.Vector3(1.25, 0.8, 1));
    }

    // Streetlights.
    function addStreetLight(x, z) {
      addMesh(new THREE.CylinderGeometry(0.16, 0.25, 8, 8), mats.rail, new THREE.Vector3(x, 4, z));
      const lampMaterial = new THREE.MeshStandardMaterial({
        color: 0xffe4a6,
        emissive: 0xffcc72,
        emissiveIntensity: 2.2
      });
      addMesh(new THREE.SphereGeometry(0.52, 12, 8), lampMaterial, new THREE.Vector3(x, 8.2, z));
    }
    for (let z = -330; z <= 330; z += 45) {
      if (Math.abs(z) < 56) continue;
      addStreetLight(-19, z);
      addStreetLight(19, z);
    }

    // Player vehicle: rigid chassis + raycast suspension + four physical wheels.
    const chassisBody = new CANNON.Body({ mass: 185, material: tyrePhysicsMaterial });
    chassisBody.addShape(new CANNON.Box(new CANNON.Vec3(1.08, 0.48, 2.25)));
    chassisBody.position.set(5.8, 2.4, -255);
    chassisBody.angularDamping = 0.46;
    chassisBody.linearDamping = 0.055;
    physicsWorld.addBody(chassisBody);

    const vehicle = new CANNON.RaycastVehicle({
      chassisBody,
      indexRightAxis: 0,
      indexUpAxis: 1,
      indexForwardAxis: 2
    });

    const wheelOptions = {
      radius: 0.47,
      directionLocal: new CANNON.Vec3(0, -1, 0),
      suspensionStiffness: 38,
      suspensionRestLength: 0.34,
      frictionSlip: 4.8,
      dampingRelaxation: 2.6,
      dampingCompression: 4.5,
      maxSuspensionForce: 100000,
      rollInfluence: 0.12,
      axleLocal: new CANNON.Vec3(-1, 0, 0),
      chassisConnectionPointLocal: new CANNON.Vec3(),
      maxSuspensionTravel: 0.32,
      customSlidingRotationalSpeed: -30,
      useCustomSlidingRotationalSpeed: true
    };

    const wheelPositions = [
      [-0.98, -0.18, -1.46], [0.98, -0.18, -1.46],
      [-0.98, -0.18, 1.44], [0.98, -0.18, 1.44]
    ];
    wheelPositions.forEach(([x, y, z]) => {
      vehicle.addWheel({
        ...wheelOptions,
        chassisConnectionPointLocal: new CANNON.Vec3(x, y, z)
      });
    });
    vehicle.addToWorld(physicsWorld);

    function createDetailedCar(colour = 0xe02434, traffic = false) {
      const group = new THREE.Group();
      const paint = new THREE.MeshPhysicalMaterial({
        color: colour,
        metalness: 0.62,
        roughness: 0.24,
        clearcoat: 1,
        clearcoatRoughness: 0.18
      });
      const trim = new THREE.MeshStandardMaterial({ color: 0x101419, metalness: 0.6, roughness: 0.38 });
      const glass = new THREE.MeshPhysicalMaterial({
        color: 0x6ca5c5,
        metalness: 0.05,
        roughness: 0.08,
        transparent: true,
        opacity: 0.68
      });
      const lightFront = new THREE.MeshStandardMaterial({ color: 0xe8f7ff, emissive: 0xbceaff, emissiveIntensity: 2.1 });
      const lightRear = new THREE.MeshStandardMaterial({ color: 0xff2438, emissive: 0xff1228, emissiveIntensity: 1.7 });

      const base = new THREE.Mesh(new THREE.BoxGeometry(2.22, 0.62, 4.55), paint);
      base.position.y = 0.18;
      base.castShadow = true;
      base.receiveShadow = true;
      group.add(base);

      const hood = new THREE.Mesh(new THREE.BoxGeometry(2.04, 0.34, 1.45), paint);
      hood.position.set(0, 0.65, -1.45);
      hood.rotation.x = -0.06;
      hood.castShadow = true;
      group.add(hood);

      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.78, 0.82, 1.92), glass);
      cabin.position.set(0, 1.03, 0.18);
      cabin.castShadow = true;
      group.add(cabin);

      const roof = new THREE.Mesh(new THREE.BoxGeometry(1.63, 0.16, 1.28), paint);
      roof.position.set(0, 1.5, 0.22);
      roof.castShadow = true;
      group.add(roof);

      const frontBumper = new THREE.Mesh(new THREE.BoxGeometry(2.16, 0.25, 0.23), trim);
      frontBumper.position.set(0, 0.06, -2.34);
      group.add(frontBumper);

      const rearBumper = frontBumper.clone();
      rearBumper.position.z = 2.34;
      group.add(rearBumper);

      for (const x of [-0.72, 0.72]) {
        const frontLamp = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.23, 0.08), lightFront);
        frontLamp.position.set(x, 0.52, -2.31);
        group.add(frontLamp);
        const rearLamp = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.22, 0.08), lightRear);
        rearLamp.position.set(x, 0.5, 2.31);
        group.add(rearLamp);
      }

      const grille = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.28, 0.1), trim);
      grille.position.set(0, 0.32, -2.32);
      group.add(grille);

      if (!traffic) {
        const mirrorGeometry = new THREE.BoxGeometry(0.24, 0.17, 0.38);
        for (const side of [-1, 1]) {
          const mirror = new THREE.Mesh(mirrorGeometry, paint);
          mirror.position.set(side * 1.2, 1.03, -0.12);
          group.add(mirror);
        }
      }

      group.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      scene.add(group);
      return group;
    }

    const carModel = createDetailedCar(0xe31e36);
    const wheelMeshes = [];
    const wheelGeometry = new THREE.CylinderGeometry(0.47, 0.47, 0.34, 22);
    wheelGeometry.rotateZ(Math.PI / 2);
    const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x111317, roughness: 0.75, metalness: 0.18 });
    const hubMaterial = new THREE.MeshStandardMaterial({ color: 0xc0c7cb, metalness: 0.9, roughness: 0.25 });

    vehicle.wheelInfos.forEach(() => {
      const wheelGroup = new THREE.Group();
      const tyre = new THREE.Mesh(wheelGeometry, wheelMaterial);
      tyre.castShadow = true;
      wheelGroup.add(tyre);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.23, 0.36, 14).rotateZ(Math.PI / 2), hubMaterial);
      wheelGroup.add(hub);
      scene.add(wheelGroup);
      wheelMeshes.push(wheelGroup);
    });

    // Traffic cars are solid kinematic physics bodies, so the player cannot pass through them.
    const trafficCars = [];
    const trafficColours = [0x1976d2, 0xf2b705, 0x16a085, 0xf1f3f5, 0x6f42c1, 0x252a34, 0xe85d3f];

    function bridgeCarHeight(z) {
      const absoluteZ = Math.abs(z);
      if (absoluteZ <= 31) return 3.25;
      if (absoluteZ < 55) return 1.12 + ((55 - absoluteZ) / 24) * 2.13;
      return 1.12;
    }

    function addTrafficCar(route, offset, direction, speed, colour) {
      const model = createDetailedCar(colour, true);
      model.scale.set(0.92, 0.92, 0.92);
      const body = new CANNON.Body({
        mass: 0,
        type: CANNON.Body.KINEMATIC,
        material: tyrePhysicsMaterial,
        shape: new CANNON.Box(new CANNON.Vec3(1.02, 0.58, 2.12))
      });
      body.collisionResponse = true;
      body.allowSleep = false;
      physicsWorld.addBody(body);
      trafficCars.push({ route, offset, direction, speed, body, model });
    }

    for (let i = 0; i < 12; i++) {
      const direction = i % 2 === 0 ? 1 : -1;
      addTrafficCar('vertical', -330 + i * 58, direction, randomRange(9, 15), trafficColours[i % trafficColours.length]);
    }
    for (let i = 0; i < 10; i++) {
      const direction = i % 2 === 0 ? 1 : -1;
      addTrafficCar(i < 5 ? 'horizontalNorth' : 'horizontalSouth', -330 + (i % 5) * 135, direction, randomRange(8, 13), trafficColours[(i + 3) % trafficColours.length]);
    }

    function updateTraffic(dt) {
      for (const car of trafficCars) {
        if (car.route === 'vertical') {
          const laneX = car.direction > 0 ? -6.4 : 6.4;
          if (!Number.isFinite(car.body.position.z) || car.body.position.lengthSquared() === 0) {
            car.body.position.set(laneX, bridgeCarHeight(car.offset), car.offset);
          }
          let z = car.body.position.z + car.direction * car.speed * dt;
          if (z > 350) z = -350;
          if (z < -350) z = 350;
          car.body.position.set(laneX, bridgeCarHeight(z), z);
          car.body.velocity.set(0, 0, car.direction * car.speed);
          car.body.quaternion.setFromEuler(0, car.direction > 0 ? Math.PI : 0, 0);
        } else {
          const z = car.route === 'horizontalNorth' ? 120 : -120;
          const laneZ = z + (car.direction > 0 ? -6.2 : 6.2);
          if (!Number.isFinite(car.body.position.x) || car.body.position.lengthSquared() === 0) {
            car.body.position.set(car.offset, 1.12, laneZ);
          }
          let x = car.body.position.x + car.direction * car.speed * dt;
          if (x > 350) x = -350;
          if (x < -350) x = 350;
          car.body.position.set(x, 1.12, laneZ);
          car.body.velocity.set(car.direction * car.speed, 0, 0);
          car.body.quaternion.setFromEuler(0, car.direction > 0 ? -Math.PI / 2 : Math.PI / 2, 0);
        }
        car.model.position.copy(car.body.position);
        car.model.quaternion.copy(car.body.quaternion);
      }
    }

    // Pedestrians walk in pairs on pavements and have collision bodies.
    const pedestrians = [];
    const skinColours = [0x7a4c2f, 0x9b6847, 0xc58b64, 0x5c3826, 0xd6a27e];
    const clothingColours = [0x2364aa, 0xe4572e, 0x25a18e, 0x6a4c93, 0xf3a712, 0x202c59];

    function createPerson(index) {
      const group = new THREE.Group();
      const skin = new THREE.MeshStandardMaterial({ color: skinColours[index % skinColours.length], roughness: 0.88 });
      const shirt = new THREE.MeshStandardMaterial({ color: clothingColours[index % clothingColours.length], roughness: 0.84 });
      const dark = new THREE.MeshStandardMaterial({ color: 0x20242a, roughness: 0.9 });

      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 0.86, 5, 9), shirt);
      torso.position.y = 1.55;
      group.add(torso);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 10), skin);
      head.position.y = 2.5;
      group.add(head);

      const legGeometry = new THREE.CapsuleGeometry(0.12, 0.75, 4, 7);
      const leftLeg = new THREE.Mesh(legGeometry, dark);
      leftLeg.position.set(-0.16, 0.63, 0);
      group.add(leftLeg);
      const rightLeg = leftLeg.clone();
      rightLeg.position.x = 0.16;
      group.add(rightLeg);

      const armGeometry = new THREE.CapsuleGeometry(0.09, 0.65, 4, 7);
      const leftArm = new THREE.Mesh(armGeometry, skin);
      leftArm.position.set(-0.48, 1.58, 0);
      group.add(leftArm);
      const rightArm = leftArm.clone();
      rightArm.position.x = 0.48;
      group.add(rightArm);

      group.traverse((child) => {
        if (child.isMesh) child.castShadow = true;
      });
      scene.add(group);
      return { group, leftLeg, rightLeg, leftArm, rightArm };
    }

    function addPedestrian(route, offset, direction, speed, index) {
      const visuals = createPerson(index);
      const body = new CANNON.Body({
        mass: 0,
        type: CANNON.Body.KINEMATIC,
        shape: new CANNON.Sphere(0.48)
      });
      body.allowSleep = false;
      physicsWorld.addBody(body);
      pedestrians.push({ route, offset, direction, speed, body, ...visuals, phase: Math.random() * Math.PI * 2 });
    }

    for (let i = 0; i < 26; i++) {
      addPedestrian('avenue', -320 + i * 25, i % 2 === 0 ? 1 : -1, randomRange(1.05, 1.85), i);
    }
    for (let i = 0; i < 18; i++) {
      addPedestrian(i < 9 ? 'crossNorth' : 'crossSouth', -310 + (i % 9) * 74, i % 2 === 0 ? 1 : -1, randomRange(0.9, 1.55), i + 30);
    }

    function updatePedestrians(dt, elapsed) {
      pedestrians.forEach((person, index) => {
        if (person.route === 'avenue') {
          const x = index % 2 === 0 ? -16.2 : 16.2;
          if (person.body.position.lengthSquared() === 0) person.body.position.set(x, 1.02, person.offset);
          let z = person.body.position.z + person.direction * person.speed * dt;
          if (z > 345) z = -345;
          if (z < -345) z = 345;
          if (Math.abs(z) < 57) z += person.direction * 115;
          person.body.position.set(x, 1.02, z);
          person.body.velocity.set(0, 0, person.direction * person.speed);
          person.body.quaternion.setFromEuler(0, person.direction > 0 ? Math.PI : 0, 0);
        } else {
          const baseZ = person.route === 'crossNorth' ? 136 : -136;
          if (person.body.position.lengthSquared() === 0) person.body.position.set(person.offset, 1.02, baseZ);
          let x = person.body.position.x + person.direction * person.speed * dt;
          if (x > 345) x = -345;
          if (x < -345) x = 345;
          person.body.position.set(x, 1.02, baseZ);
          person.body.velocity.set(person.direction * person.speed, 0, 0);
          person.body.quaternion.setFromEuler(0, person.direction > 0 ? -Math.PI / 2 : Math.PI / 2, 0);
        }

        person.group.position.copy(person.body.position);
        person.group.quaternion.copy(person.body.quaternion);
        const stride = Math.sin(elapsed * 7 * person.speed + person.phase) * 0.48;
        person.leftLeg.rotation.x = stride;
        person.rightLeg.rotation.x = -stride;
        person.leftArm.rotation.x = -stride * 0.72;
        person.rightArm.rotation.x = stride * 0.72;
      });
    }

    // Input and Arduino Web Serial.
    const keys = new Set();
    let serialPort = null;
    let potentiometerSteer = 0;
    let potentiometerRaw = 512;
    let serialConnected = false;

    const speedElement = document.getElementById('speed');
    const steeringElement = document.getElementById('steeringValue');
    const serialStatus = document.getElementById('serialStatus');
    const connectButton = document.getElementById('connectBtn');
    const impactElement = document.getElementById('impact');

    addEventListener('keydown', (event) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(event.code)) event.preventDefault();
      keys.add(event.code);
      if (event.code === 'KeyR') resetPlayer();
    });
    addEventListener('keyup', (event) => keys.delete(event.code));

    async function connectArduino() {
      if (!('serial' in navigator)) {
        alert('Web Serial is unavailable. Use desktop Chrome or Edge through HTTPS or localhost.');
        return;
      }
      try {
        serialPort = await navigator.serial.requestPort();
        await serialPort.open({ baudRate: 9600 });
        serialConnected = true;
        serialStatus.textContent = 'Connected';
        serialStatus.className = 'font-bold text-emerald-300';
        connectButton.textContent = 'ARDUINO CONNECTED';
        connectButton.disabled = true;
        connectButton.classList.add('opacity-70');

        const decoder = new TextDecoderStream();
        serialPort.readable.pipeTo(decoder.writable).catch(() => {});
        const reader = decoder.readable.getReader();
        let buffer = '';
        while (serialConnected) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop() ?? '';
          for (const line of lines) {
            const parsed = Number.parseInt(line.trim(), 10);
            if (!Number.isNaN(parsed)) {
              potentiometerRaw = clamp(parsed, 0, 1023);
              let normalised = (potentiometerRaw - 511.5) / 511.5;
              if (Math.abs(normalised) < 0.075) normalised = 0;
              potentiometerSteer = clamp(normalised, -1, 1);
            }
          }
        }
      } catch (error) {
        serialConnected = false;
        serialStatus.textContent = 'Connection failed';
        serialStatus.className = 'font-bold text-red-300';
        connectButton.disabled = false;
        connectButton.textContent = 'RETRY ARDUINO CONNECTION';
        alert(`Serial connection failed: ${error.message}`);
      }
    }
    connectButton.addEventListener('click', connectArduino);

    let impactTimer = 0;
    chassisBody.addEventListener('collide', (event) => {
      const impact = Math.abs(event.contact.getImpactVelocityAlongNormal());
      if (impact > 4.2) {
        impactElement.textContent = impact > 10 ? 'HEAVY IMPACT' : 'IMPACT';
        impactElement.classList.remove('hidden');
        impactTimer = 0.7;
      }
    });

    function resetPlayer() {
      chassisBody.position.set(5.8, 3.2, -255);
      chassisBody.velocity.setZero();
      chassisBody.angularVelocity.setZero();
      chassisBody.quaternion.setFromEuler(0, 0, 0);
      chassisBody.wakeUp();
    }

    function forwardSpeed() {
      const localVelocity = new CANNON.Vec3();
      chassisBody.vectorToLocalFrame(chassisBody.velocity, localVelocity);
      return -localVelocity.z;
    }

    function applyVehicleControls() {
      const keyboardSteer = (keys.has('ArrowLeft') ? -1 : 0) + (keys.has('ArrowRight') ? 1 : 0);
      const usingKeyboardSteer = keyboardSteer !== 0;
      const steerInput = usingKeyboardSteer ? keyboardSteer : (serialConnected ? potentiometerSteer : 0);
      const steeringAngle = steerInput * 0.48;
      vehicle.setSteeringValue(steeringAngle, 0);
      vehicle.setSteeringValue(steeringAngle, 1);

      const maxEngineForce = 1750;
      const currentForwardSpeed = forwardSpeed();
      let engineForce = 0;
      let brakeForce = 1.5;

      if (keys.has('ArrowUp')) {
        engineForce = -maxEngineForce;
        brakeForce = 0;
      }
      if (keys.has('ArrowDown')) {
        if (currentForwardSpeed > 1.7) {
          brakeForce = 52;
        } else {
          engineForce = maxEngineForce * 0.58;
          brakeForce = 0;
        }
      }
      if (keys.has('Space')) brakeForce = 120;

      vehicle.applyEngineForce(0, 0);
      vehicle.applyEngineForce(0, 1);
      vehicle.applyEngineForce(engineForce, 2);
      vehicle.applyEngineForce(engineForce, 3);
      for (let i = 0; i < 4; i++) vehicle.setBrake(brakeForce, i);

      if (usingKeyboardSteer) {
        steeringElement.textContent = steerInput < 0 ? 'Keyboard left' : 'Keyboard right';
      } else if (serialConnected) {
        steeringElement.textContent = `${potentiometerRaw} (${Math.round(steerInput * 100)}%)`;
      } else {
        steeringElement.textContent = 'Keyboard';
      }
    }

    const clock = new THREE.Clock();
    const cameraTarget = new THREE.Vector3();
    const desiredCameraPosition = new THREE.Vector3();
    const desiredLookAt = new THREE.Vector3();

    function syncPlayerVisuals() {
      carModel.position.copy(chassisBody.position);
      carModel.quaternion.copy(chassisBody.quaternion);
      for (let i = 0; i < vehicle.wheelInfos.length; i++) {
        vehicle.updateWheelTransform(i);
        const transform = vehicle.wheelInfos[i].worldTransform;
        wheelMeshes[i].position.copy(transform.position);
        wheelMeshes[i].quaternion.copy(transform.quaternion);
      }
    }

    function updateCamera(dt) {
      const behind = new THREE.Vector3(0, 4.7, 10.5).applyQuaternion(carModel.quaternion);
      const ahead = new THREE.Vector3(0, 1.0, -4.0).applyQuaternion(carModel.quaternion);
      desiredCameraPosition.copy(carModel.position).add(behind);
      desiredLookAt.copy(carModel.position).add(ahead);
      const smoothing = 1 - Math.pow(0.002, dt);
      camera.position.lerp(desiredCameraPosition, smoothing);
      cameraTarget.lerp(desiredLookAt, smoothing);
      camera.lookAt(cameraTarget);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 1 / 24);
      const elapsed = clock.elapsedTime;

      applyVehicleControls();
      updateTraffic(dt);
      updatePedestrians(dt, elapsed);
      physicsWorld.step(1 / 60, dt, 4);
      syncPlayerVisuals();
      updateCamera(dt);
      updateFoam(dt);

      riverUniforms.time.value = elapsed;
      waterfallUniforms.time.value = elapsed;
      speedElement.textContent = `${Math.round(chassisBody.velocity.length() * 3.6)} km/h`;

      if (impactTimer > 0) {
        impactTimer -= dt;
        if (impactTimer <= 0) impactElement.classList.add('hidden');
      }

      if (chassisBody.position.y < -12 || Math.abs(chassisBody.position.x) > 390 || Math.abs(chassisBody.position.z) > 390) {
        resetPlayer();
      }

      renderer.render(scene, camera);
    }

    resetPlayer();
    camera.position.set(8, 8, -242);
    cameraTarget.copy(chassisBody.position);
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
