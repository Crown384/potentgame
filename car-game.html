<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Potentiometer City Driver</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 overflow-hidden bg-sky-200 font-mono text-white" tabindex="0">
  <div class="pointer-events-none fixed inset-0 z-20">
    <section class="pointer-events-auto absolute left-4 top-4 w-[min(94vw,420px)] rounded-2xl border border-white/20 bg-slate-950/80 p-4 shadow-2xl backdrop-blur-xl">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p class="text-[10px] font-bold uppercase tracking-[0.28em] text-cyan-300">Three.js collision physics</p>
          <h1 class="mt-1 text-xl font-black">CITY DRIVER</h1>
        </div>
        <div id="speed" class="min-w-24 rounded-xl bg-white/10 px-3 py-2 text-right text-sm font-black">0 km/h</div>
      </div>

      <div class="mt-4 grid grid-cols-4 gap-2 text-[11px]">
        <div class="rounded-xl bg-white/5 p-2"><span class="block text-slate-400">Steering</span><span id="steeringValue" class="font-bold text-cyan-300">Keyboard</span></div>
        <div class="rounded-xl bg-white/5 p-2"><span class="block text-slate-400">Arduino</span><span id="serialStatus" class="font-bold text-amber-300">Offline</span></div>
        <div class="rounded-xl bg-white/5 p-2"><span class="block text-slate-400">Traffic</span><span id="trafficStatus" class="font-bold text-emerald-300">Yielding</span></div>
        <div class="rounded-xl bg-white/5 p-2"><span class="block text-slate-400">Drive</span><span id="driveStatus" class="font-bold text-white">Idle</span></div>
      </div>

      <button id="connectBtn" class="mt-3 w-full rounded-xl bg-cyan-300 px-4 py-3 text-sm font-black text-slate-950 shadow-lg shadow-cyan-300/20 transition hover:bg-white">CONNECT ARDUINO NANO</button>

      <div class="mt-3 grid grid-cols-2 gap-2 text-[11px] text-slate-300">
        <div class="rounded-lg border border-white/10 p-2">↑ / W Accelerate</div>
        <div class="rounded-lg border border-white/10 p-2">↓ / S Brake then reverse</div>
        <div class="rounded-lg border border-white/10 p-2">← → / A D Steering</div>
        <div class="rounded-lg border border-white/10 p-2">Space Handbrake</div>
        <div class="col-span-2 rounded-lg border border-white/10 p-2 text-center">R Reset vehicle</div>
      </div>
    </section>

    <div id="impact" class="absolute left-1/2 top-24 hidden -translate-x-1/2 rounded-full border border-red-300/40 bg-red-950/80 px-5 py-2 text-sm font-black text-red-200 shadow-xl backdrop-blur-md">IMPACT</div>
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 rounded-full border border-white/20 bg-slate-950/75 px-5 py-2 text-center text-xs text-slate-200 backdrop-blur-md">The car now moves directly. Left turns left; right turns right.</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js';

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const randomRange = (min, max) => min + Math.random() * (max - min);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ed8ff);
    scene.fog = new THREE.FogExp2(0xa8d8ee, 0.00135);

    const camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, 0.1, 2500);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.domElement.className = 'fixed inset-0 block';
    document.body.prepend(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xe8f7ff, 0x34592d, 2.15));
    const sun = new THREE.DirectionalLight(0xfff2d1, 4.1);
    sun.position.set(-180, 250, -130);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -420;
    sun.shadow.camera.right = 420;
    sun.shadow.camera.top = 420;
    sun.shadow.camera.bottom = -420;
    scene.add(sun);

    const world = new THREE.Group();
    scene.add(world);

    const mats = {
      grass: new THREE.MeshStandardMaterial({ color: 0x4f9a48, roughness: 1 }),
      road: new THREE.MeshStandardMaterial({ color: 0x252b31, roughness: 0.96 }),
      sidewalk: new THREE.MeshStandardMaterial({ color: 0xa4adb3, roughness: 0.9 }),
      bridge: new THREE.MeshStandardMaterial({ color: 0x5b6670, roughness: 0.82 }),
      rail: new THREE.MeshStandardMaterial({ color: 0xdbe3e8, metalness: 0.62, roughness: 0.32 }),
      rock: new THREE.MeshStandardMaterial({ color: 0x585e5d, roughness: 1 }),
      tree: new THREE.MeshStandardMaterial({ color: 0x287244, roughness: 1 }),
      trunk: new THREE.MeshStandardMaterial({ color: 0x654326, roughness: 1 }),
      yellow: new THREE.MeshStandardMaterial({ color: 0xf5df61, roughness: 0.75 }),
      white: new THREE.MeshStandardMaterial({ color: 0xf5f7f8, roughness: 0.75 })
    };

    const boxObstacles = [];
    const circleObstacles = [];

    function addMesh(geometry, material, x, y, z, rotation = new THREE.Euler(), parent = world) {
      const object = new THREE.Mesh(geometry, material);
      object.position.set(x, y, z);
      object.rotation.copy(rotation);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function addBox(width, height, depth, x, y, z, material, collision = false) {
      const object = addMesh(new THREE.BoxGeometry(width, height, depth), material, x, y, z);
      if (collision) boxObstacles.push({ x, z, halfX: width / 2, halfZ: depth / 2 });
      return object;
    }

    function addRock(radius, x, z) {
      const rock = addMesh(new THREE.IcosahedronGeometry(radius, 2), mats.rock, x, radius * 0.72, z);
      rock.scale.set(1.2, 0.8, 1);
      circleObstacles.push({ x, z, radius: radius * 0.92 });
    }

    // Ground, roads and sidewalks.
    addBox(760, 8, 360, 0, -4, -210, mats.grass);
    addBox(760, 8, 360, 0, -4, 210, mats.grass);
    addBox(27, 0.18, 350, 0, 0.09, -205, mats.road);
    addBox(27, 0.18, 350, 0, 0.09, 205, mats.road);
    addBox(720, 0.18, 27, 0, 0.09, -120, mats.road);
    addBox(720, 0.18, 27, 0, 0.09, 120, mats.road);

    for (const side of [-1, 1]) {
      addBox(5, 0.4, 350, side * 16.2, 0.2, -205, mats.sidewalk);
      addBox(5, 0.4, 350, side * 16.2, 0.2, 205, mats.sidewalk);
      for (const streetZ of [-120, 120]) addBox(720, 0.4, 5, 0, 0.2, streetZ + side * 16.2, mats.sidewalk);
    }

    // River and bridge.
    const riverUniforms = { time: { value: 0 } };
    const riverMaterial = new THREE.ShaderMaterial({
      transparent: true,
      side: THREE.DoubleSide,
      uniforms: riverUniforms,
      vertexShader: `varying vec2 vUv; uniform float time; void main(){vUv=uv; vec3 p=position; p.z += sin(p.x*.07+time*2.)*.3; p.z += sin(p.y*.15-time*1.3)*.18; gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
      fragmentShader: `varying vec2 vUv; uniform float time; void main(){float a=sin(vUv.x*95.+time*3.2)*.5+.5; float b=sin(vUv.y*40.-time*2.1)*.5+.5; vec3 c=mix(vec3(.01,.16,.31),vec3(.04,.52,.72),a*.32+b*.22); c += smoothstep(.86,1.,a*b)*.27; gl_FragColor=vec4(c,.9);}`
    });
    const river = new THREE.Mesh(new THREE.PlaneGeometry(760, 60, 100, 20), riverMaterial);
    river.rotation.x = -Math.PI / 2;
    river.position.y = -2.2;
    world.add(river);

    addBox(31, 2.2, 64, 0, 1.1, 0, mats.bridge);
    addBox(31, 1.6, 25, 0, 0.75, -43, mats.bridge);
    addBox(31, 1.6, 25, 0, 0.75, 43, mats.bridge);
    addBox(0.7, 2.1, 88, -15, 3.1, 0, mats.rail, true);
    addBox(0.7, 2.1, 88, 15, 3.1, 0, mats.rail, true);

    function roadMark(x, y, z, width, depth, material = mats.yellow) {
      const mark = addMesh(new THREE.BoxGeometry(width, 0.04, depth), material, x, y, z);
      mark.castShadow = false;
    }
    for (let z = -360; z <= 360; z += 15) if (Math.abs(z) > 58) roadMark(0, 0.21, z, 0.34, 7);
    for (let x = -350; x <= 350; x += 15) {
      roadMark(x, 0.21, -120, 7, 0.34);
      roadMark(x, 0.21, 120, 7, 0.34);
    }
    for (let z = -28; z <= 28; z += 12) roadMark(0, 2.22, z, 0.34, 6);

    // Waterfall.
    const waterfallUniforms = { time: { value: 0 } };
    const waterfallMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      uniforms: waterfallUniforms,
      vertexShader: `varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
      fragmentShader: `varying vec2 vUv; uniform float time; float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);} void main(){float a=sin(vUv.x*76.-vUv.y*22.-time*10.); float b=sin(vUv.x*33.+vUv.y*86.+time*12.); float n=h(floor(vec2(vUv.x*40.,(vUv.y-time)*65.))); float edge=smoothstep(0.,.1,vUv.x)*smoothstep(1.,.9,vUv.x); float alpha=edge*(.44+.22*a+.13*b+.25*n); vec3 c=mix(vec3(.08,.42,.68),vec3(.92,.99,1.),.58+a*.22); gl_FragColor=vec4(c,clamp(alpha,0.,.85));}`
    });
    const waterfall = new THREE.Mesh(new THREE.PlaneGeometry(36, 35, 32, 44), waterfallMaterial);
    waterfall.rotation.y = Math.PI / 2;
    waterfall.position.set(-245, 12.5, 0);
    world.add(waterfall);
    const waterfall2 = waterfall.clone();
    waterfall2.position.x -= 0.8;
    waterfall2.scale.set(0.92, 1, 0.95);
    world.add(waterfall2);
    addBox(22, 31, 82, -256, 7.5, 0, mats.rock, true);

    const particleCount = 360;
    const particlePositions = new Float32Array(particleCount * 3);
    const particleVelocity = [];
    for (let i = 0; i < particleCount; i++) {
      const i3 = i * 3;
      particlePositions[i3] = randomRange(-248, -238);
      particlePositions[i3 + 1] = randomRange(-2.5, 2.5);
      particlePositions[i3 + 2] = randomRange(-18, 18);
      particleVelocity.push(new THREE.Vector3(randomRange(-0.3, 1.8), randomRange(1, 4.3), randomRange(-1.6, 1.6)));
    }
    const foamGeometry = new THREE.BufferGeometry();
    foamGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const foam = new THREE.Points(foamGeometry, new THREE.PointsMaterial({ color: 0xeaffff, size: 1.2, transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending }));
    world.add(foam);

    function updateFoam(dt) {
      const positions = foamGeometry.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const velocity = particleVelocity[i];
        positions[i3] += velocity.x * dt;
        positions[i3 + 1] += velocity.y * dt;
        positions[i3 + 2] += velocity.z * dt;
        velocity.y -= 2.5 * dt;
        if (positions[i3 + 1] < -3 || positions[i3] > -232) {
          positions[i3] = randomRange(-248, -241);
          positions[i3 + 1] = randomRange(-2.4, 0.8);
          positions[i3 + 2] = randomRange(-17, 17);
          velocity.set(randomRange(0.1, 2), randomRange(1.2, 4.8), randomRange(-1.8, 1.8));
        }
      }
      foamGeometry.attributes.position.needsUpdate = true;
    }

    // Buildings and trees.
    function addBuilding(x, z, width, depth, height, colour) {
      const canvas = document.createElement('canvas');
      canvas.width = 96;
      canvas.height = 192;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#17212b';
      ctx.fillRect(0, 0, 96, 192);
      for (let y = 7; y < 187; y += 14) {
        for (let px = 6; px < 92; px += 13) {
          ctx.fillStyle = Math.random() > 0.34 ? (Math.random() > 0.28 ? '#f4d98f' : '#73d7ff') : '#263543';
          ctx.fillRect(px, y, 7, 8);
        }
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const material = new THREE.MeshStandardMaterial({ color: colour, map: texture, emissive: 0x203040, emissiveMap: texture, emissiveIntensity: 0.2 });
      addBox(width, height, depth, x, height / 2, z, material, true);
    }

    const buildingColours = [0x8795a3, 0x536879, 0x9a806b, 0x6f7c88, 0x4d6272];
    for (const side of [-1, 1]) {
      for (let z = -320; z <= 320; z += 58) {
        if (Math.abs(z) < 68 || Math.abs(z - 120) < 30 || Math.abs(z + 120) < 30) continue;
        const x = side * randomRange(45, 100);
        addBuilding(x, z + randomRange(-10, 10), randomRange(24, 38), randomRange(25, 40), randomRange(38, 115), buildingColours[Math.floor(Math.random() * buildingColours.length)]);
      }
    }
    for (const streetZ of [-120, 120]) {
      for (let x = -320; x <= 320; x += 65) {
        if (Math.abs(x) < 38) continue;
        addBuilding(x, streetZ + (x % 2 === 0 ? 50 : -50), randomRange(28, 45), randomRange(24, 38), randomRange(40, 125), buildingColours[Math.floor(Math.random() * buildingColours.length)]);
      }
    }

    for (let i = 0; i < 34; i++) {
      const x = randomRange(-330, 330);
      const z = Math.random() > 0.5 ? randomRange(65, 340) : randomRange(-340, -65);
      if (Math.abs(x) < 26 || Math.abs(z - 120) < 26 || Math.abs(z + 120) < 26) continue;
      addMesh(new THREE.CylinderGeometry(0.45, 0.7, 5, 8), mats.trunk, x, 2.5, z);
      addMesh(new THREE.ConeGeometry(3.6, 8, 10), mats.tree, x, 8, z);
    }

    const rockData = [[-82,-78,4.2],[76,-72,5.5],[-94,82,4.8],[95,73,5.2],[-150,-155,4.4],[145,165,5.8],[-200,75,6.2],[210,-72,5.5]];
    for (const [x, z, radius] of rockData) addRock(radius, x, z);

    function createCar(colour = 0xe31e36) {
      const group = new THREE.Group();
      const paint = new THREE.MeshPhysicalMaterial({ color: colour, metalness: 0.62, roughness: 0.24, clearcoat: 1, clearcoatRoughness: 0.18 });
      const trim = new THREE.MeshStandardMaterial({ color: 0x11151a, metalness: 0.6, roughness: 0.38 });
      const glass = new THREE.MeshPhysicalMaterial({ color: 0x6ca5c5, roughness: 0.08, transparent: true, opacity: 0.68 });
      const frontLight = new THREE.MeshStandardMaterial({ color: 0xe8f7ff, emissive: 0xbceaff, emissiveIntensity: 2 });
      const rearLight = new THREE.MeshStandardMaterial({ color: 0xff2438, emissive: 0xff1228, emissiveIntensity: 1.8 });
      addMesh(new THREE.BoxGeometry(2.25, 0.62, 4.6), paint, 0, 0.2, 0, new THREE.Euler(), group);
      addMesh(new THREE.BoxGeometry(2.04, 0.34, 1.45), paint, 0, 0.66, -1.46, new THREE.Euler(-0.06,0,0), group);
      addMesh(new THREE.BoxGeometry(1.8, 0.82, 1.92), glass, 0, 1.03, 0.18, new THREE.Euler(), group);
      addMesh(new THREE.BoxGeometry(1.64, 0.16, 1.3), paint, 0, 1.5, 0.22, new THREE.Euler(), group);
      addMesh(new THREE.BoxGeometry(2.17, 0.25, 0.23), trim, 0, 0.06, -2.35, new THREE.Euler(), group);
      addMesh(new THREE.BoxGeometry(2.17, 0.25, 0.23), trim, 0, 0.06, 2.35, new THREE.Euler(), group);
      for (const x of [-0.72, 0.72]) {
        addMesh(new THREE.BoxGeometry(0.55, 0.23, 0.08), frontLight, x, 0.52, -2.33, new THREE.Euler(), group);
        addMesh(new THREE.BoxGeometry(0.52, 0.22, 0.08), rearLight, x, 0.5, 2.33, new THREE.Euler(), group);
      }
      const tyre = new THREE.MeshStandardMaterial({ color: 0x101216, roughness: 0.78 });
      const hub = new THREE.MeshStandardMaterial({ color: 0xc0c7cb, metalness: 0.9, roughness: 0.25 });
      for (const x of [-1.08, 1.08]) {
        for (const z of [-1.48, 1.48]) {
          const wheel = new THREE.Group();
          const tyreMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.47, 0.47, 0.34, 20).rotateZ(Math.PI / 2), tyre);
          const hubMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.23, 0.36, 14).rotateZ(Math.PI / 2), hub);
          wheel.add(tyreMesh, hubMesh);
          wheel.position.set(x, -0.2, z);
          group.add(wheel);
        }
      }
      group.traverse((child) => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });
      scene.add(group);
      return group;
    }

    const playerModel = createCar();
    const player = { x: 5.8, z: -255, yaw: 0, speed: 0, radius: 1.65 };

    function bridgeHeight(z) {
      const az = Math.abs(z);
      if (az <= 31) return 2.92;
      if (az < 56) return 0.9 + ((56 - az) / 25) * 2.02;
      return 0.9;
    }

    function groundHeight(x, z) {
      if (Math.abs(x) < 14.4 && Math.abs(z) < 56) return bridgeHeight(z);
      return 0.9;
    }

    function circleHitsBox(x, z, radius, box) {
      const nearestX = clamp(x, box.x - box.halfX, box.x + box.halfX);
      const nearestZ = clamp(z, box.z - box.halfZ, box.z + box.halfZ);
      const dx = x - nearestX;
      const dz = z - nearestZ;
      return dx * dx + dz * dz < radius * radius;
    }

    const trafficCars = [];
    const trafficColours = [0x1976d2,0xf2b705,0x16a085,0xf1f3f5,0x6f42c1,0x252a34,0xe85d3f];

    function addTraffic(route, position, direction, speed, colour) {
      const model = createCar(colour);
      model.scale.set(0.92, 0.92, 0.92);
      trafficCars.push({ route, position, direction, baseSpeed: speed, currentSpeed: speed, model, x: 0, z: 0, radius: 2.25 });
    }
    for (let i = 0; i < 12; i++) addTraffic('vertical', -330 + i * 58, i % 2 === 0 ? 1 : -1, randomRange(8, 13), trafficColours[i % trafficColours.length]);
    for (let i = 0; i < 10; i++) addTraffic(i < 5 ? 'horizontalNorth' : 'horizontalSouth', -330 + (i % 5) * 135, i % 2 === 0 ? 1 : -1, randomRange(7, 11), trafficColours[(i + 3) % trafficColours.length]);

    function trafficGapAhead(car) {
      let best = Infinity;
      for (const other of trafficCars) {
        if (other === car || other.route !== car.route || other.direction !== car.direction) continue;
        const gap = car.route === 'vertical' ? car.direction * (other.z - car.z) : car.direction * (other.x - car.x);
        if (gap > 0 && gap < best) best = gap;
      }
      return best;
    }

    function playerGapAhead(car) {
      if (car.route === 'vertical') {
        const laneX = car.direction > 0 ? -6.4 : 6.4;
        if (Math.abs(player.x - laneX) > 5) return Infinity;
        return car.direction * (player.z - car.z);
      }
      const streetZ = car.route === 'horizontalNorth' ? 120 : -120;
      const laneZ = streetZ + (car.direction > 0 ? -6.2 : 6.2);
      if (Math.abs(player.z - laneZ) > 5) return Infinity;
      return car.direction * (player.x - car.x);
    }

    function safeSpeed(gap, baseSpeed) {
      if (gap <= 9) return 0;
      if (gap >= 32) return baseSpeed;
      return baseSpeed * ((gap - 9) / 23);
    }

    function updateTraffic(dt) {
      let stopped = 0;
      for (const car of trafficCars) {
        let targetSpeed = car.baseSpeed;
        const playerGap = playerGapAhead(car);
        const carGap = trafficGapAhead(car);
        if (playerGap > 0 && playerGap < 36) targetSpeed = Math.min(targetSpeed, safeSpeed(playerGap, car.baseSpeed));
        if (carGap > 0 && carGap < 32) targetSpeed = Math.min(targetSpeed, safeSpeed(carGap, car.baseSpeed));
        car.currentSpeed += (targetSpeed - car.currentSpeed) * Math.min(1, dt * (targetSpeed < car.currentSpeed ? 5.5 : 1.4));
        if (car.currentSpeed < 0.18) { car.currentSpeed = 0; stopped++; }

        if (car.route === 'vertical') {
          car.x = car.direction > 0 ? -6.4 : 6.4;
          car.position += car.direction * car.currentSpeed * dt;
          if (car.position > 350) car.position = -350;
          if (car.position < -350) car.position = 350;
          car.z = car.position;
          car.model.rotation.y = car.direction > 0 ? Math.PI : 0;
        } else {
          const streetZ = car.route === 'horizontalNorth' ? 120 : -120;
          car.z = streetZ + (car.direction > 0 ? -6.2 : 6.2);
          car.position += car.direction * car.currentSpeed * dt;
          if (car.position > 350) car.position = -350;
          if (car.position < -350) car.position = 350;
          car.x = car.position;
          car.model.rotation.y = car.direction > 0 ? -Math.PI / 2 : Math.PI / 2;
        }
        car.model.position.set(car.x, groundHeight(car.x, car.z), car.z);
      }
      document.getElementById('trafficStatus').textContent = stopped > 0 ? `${stopped} stopped` : 'Yielding';
    }

    const pedestrians = [];
    const skinColours = [0x7a4c2f,0x9b6847,0xc58b64,0x5c3826,0xd6a27e];
    const clothes = [0x2364aa,0xe4572e,0x25a18e,0x6a4c93,0xf3a712,0x202c59];

    function createPerson(index) {
      const group = new THREE.Group();
      const skin = new THREE.MeshStandardMaterial({ color: skinColours[index % skinColours.length], roughness: 0.88 });
      const shirt = new THREE.MeshStandardMaterial({ color: clothes[index % clothes.length], roughness: 0.84 });
      const dark = new THREE.MeshStandardMaterial({ color: 0x20242a, roughness: 0.9 });
      const torso = addMesh(new THREE.CapsuleGeometry(0.34,0.86,5,9), shirt, 0,1.55,0,new THREE.Euler(),group);
      addMesh(new THREE.SphereGeometry(0.3,12,10), skin, 0,2.5,0,new THREE.Euler(),group);
      const leftLeg = addMesh(new THREE.CapsuleGeometry(0.12,0.75,4,7), dark, -0.16,0.63,0,new THREE.Euler(),group);
      const rightLeg = addMesh(new THREE.CapsuleGeometry(0.12,0.75,4,7), dark, 0.16,0.63,0,new THREE.Euler(),group);
      const leftArm = addMesh(new THREE.CapsuleGeometry(0.09,0.65,4,7), skin, -0.48,1.58,0,new THREE.Euler(),group);
      const rightArm = addMesh(new THREE.CapsuleGeometry(0.09,0.65,4,7), skin, 0.48,1.58,0,new THREE.Euler(),group);
      scene.add(group);
      return { group, leftLeg, rightLeg, leftArm, rightArm };
    }

    for (let i = 0; i < 24; i++) pedestrians.push({ route: 'avenue', position: -320 + i * 27, direction: i % 2 === 0 ? 1 : -1, speed: randomRange(0.9,1.55), phase: Math.random()*Math.PI*2, ...createPerson(i), x:0, z:0 });
    for (let i = 0; i < 16; i++) pedestrians.push({ route: i < 8 ? 'crossNorth' : 'crossSouth', position: -300 + (i % 8) * 84, direction: i % 2 === 0 ? 1 : -1, speed: randomRange(0.85,1.4), phase: Math.random()*Math.PI*2, ...createPerson(i+30), x:0, z:0 });

    function updatePedestrians(dt, elapsed) {
      pedestrians.forEach((person, index) => {
        person.position += person.direction * person.speed * dt;
        if (person.position > 342) person.position = -342;
        if (person.position < -342) person.position = 342;
        if (person.route === 'avenue') {
          person.x = index % 2 === 0 ? -16.2 : 16.2;
          person.z = person.position;
          person.group.rotation.y = person.direction > 0 ? Math.PI : 0;
        } else {
          const streetZ = person.route === 'crossNorth' ? 120 : -120;
          person.x = person.position;
          person.z = streetZ + (index % 2 === 0 ? -16.2 : 16.2);
          person.group.rotation.y = person.direction > 0 ? -Math.PI/2 : Math.PI/2;
        }
        person.group.position.set(person.x, 0, person.z);
        const stride = Math.sin(elapsed * 7 * person.speed + person.phase) * 0.52;
        person.leftLeg.rotation.x = stride;
        person.rightLeg.rotation.x = -stride;
        person.leftArm.rotation.x = -stride * 0.7;
        person.rightArm.rotation.x = stride * 0.7;
      });
    }

    function blockedAt(x, z) {
      if (Math.abs(x) > 375 || Math.abs(z) > 375) return true;
      if (Math.abs(z) < 29 && Math.abs(x) > 13.3) return true;
      for (const box of boxObstacles) if (circleHitsBox(x, z, player.radius, box)) return true;
      for (const circle of circleObstacles) {
        const dx = x - circle.x;
        const dz = z - circle.z;
        if (dx * dx + dz * dz < (player.radius + circle.radius) ** 2) return true;
      }
      for (const car of trafficCars) {
        const dx = x - car.x;
        const dz = z - car.z;
        if (dx * dx + dz * dz < (player.radius + car.radius) ** 2) return true;
      }
      for (const person of pedestrians) {
        const dx = x - person.x;
        const dz = z - person.z;
        if (dx * dx + dz * dz < 2.2 ** 2) return true;
      }
      return false;
    }

    const controls = { up:false, down:false, left:false, right:false, handbrake:false };
    const keyMap = new Map([
      ['ArrowUp','up'],['KeyW','up'],['w','up'],['W','up'],
      ['ArrowDown','down'],['KeyS','down'],['s','down'],['S','down'],
      ['ArrowLeft','left'],['KeyA','left'],['a','left'],['A','left'],
      ['ArrowRight','right'],['KeyD','right'],['d','right'],['D','right'],
      ['Space','handbrake'],[' ','handbrake']
    ]);

    function setControl(event, active) {
      const control = keyMap.get(event.code) || keyMap.get(event.key);
      if (!control) return;
      event.preventDefault();
      controls[control] = active;
    }
    addEventListener('keydown', (event) => {
      setControl(event, true);
      if (event.code === 'KeyR' || event.key === 'r' || event.key === 'R') resetPlayer();
    });
    addEventListener('keyup', (event) => setControl(event, false));
    addEventListener('blur', () => Object.keys(controls).forEach((key) => controls[key] = false));

    const speedElement = document.getElementById('speed');
    const steeringElement = document.getElementById('steeringValue');
    const serialStatus = document.getElementById('serialStatus');
    const connectButton = document.getElementById('connectBtn');
    const driveStatus = document.getElementById('driveStatus');
    const impactElement = document.getElementById('impact');
    let impactTimer = 0;
    let serialConnected = false;
    let potentiometerRaw = 512;
    let potentiometerSteer = 0;

    async function connectArduino() {
      if (!('serial' in navigator)) {
        alert('Use desktop Chrome or Edge through HTTPS or localhost for Web Serial.');
        return;
      }
      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        serialConnected = true;
        serialStatus.textContent = 'Connected';
        serialStatus.className = 'font-bold text-emerald-300';
        connectButton.textContent = 'ARDUINO CONNECTED';
        connectButton.disabled = true;
        connectButton.classList.add('opacity-70');
        const decoder = new TextDecoderStream();
        port.readable.pipeTo(decoder.writable).catch(() => {});
        const reader = decoder.readable.getReader();
        let buffer = '';
        while (serialConnected) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop() || '';
          for (const line of lines) {
            const parsed = Number.parseInt(line.trim(), 10);
            if (!Number.isNaN(parsed)) {
              potentiometerRaw = clamp(parsed, 0, 1023);
              let normalised = (potentiometerRaw - 511.5) / 511.5;
              if (Math.abs(normalised) < 0.075) normalised = 0;
              potentiometerSteer = clamp(normalised, -1, 1);
            }
          }
        }
      } catch (error) {
        serialConnected = false;
        serialStatus.textContent = 'Connection failed';
        serialStatus.className = 'font-bold text-red-300';
        connectButton.disabled = false;
        connectButton.textContent = 'RETRY ARDUINO CONNECTION';
        alert(`Serial connection failed: ${error.message}`);
      }
    }
    connectButton.addEventListener('click', connectArduino);

    function showImpact() {
      impactElement.classList.remove('hidden');
      impactTimer = 0.55;
    }

    function resetPlayer() {
      player.x = 5.8;
      player.z = -255;
      player.yaw = 0;
      player.speed = 0;
      playerModel.position.set(player.x, groundHeight(player.x, player.z), player.z);
      playerModel.rotation.set(0, player.yaw, 0);
    }

    function updatePlayer(dt) {
      if (controls.up && !controls.down) {
        player.speed += 16 * dt;
        driveStatus.textContent = 'Accelerating';
        driveStatus.className = 'font-bold text-emerald-300';
      } else if (controls.down && !controls.up) {
        if (player.speed > 0.25) {
          player.speed = Math.max(0, player.speed - 27 * dt);
          driveStatus.textContent = 'Braking';
          driveStatus.className = 'font-bold text-amber-300';
        } else {
          player.speed -= 10 * dt;
          driveStatus.textContent = 'Reversing';
          driveStatus.className = 'font-bold text-fuchsia-300';
        }
      } else if (controls.handbrake) {
        player.speed *= Math.pow(0.08, dt * 6);
        if (Math.abs(player.speed) < 0.04) player.speed = 0;
        driveStatus.textContent = 'Handbrake';
        driveStatus.className = 'font-bold text-red-300';
      } else {
        player.speed *= Math.pow(0.982, dt * 60);
        if (Math.abs(player.speed) < 0.025) player.speed = 0;
        driveStatus.textContent = player.speed === 0 ? 'Idle' : 'Coasting';
        driveStatus.className = 'font-bold text-white';
      }
      player.speed = clamp(player.speed, -10, 30);

      // Positive steer turns left with this forward-vector convention.
      const keyboardSteer = (controls.left ? 1 : 0) + (controls.right ? -1 : 0);
      const serialSteer = -potentiometerSteer;
      const steer = keyboardSteer !== 0 ? keyboardSteer : (serialConnected ? serialSteer : 0);
      const reverseMultiplier = player.speed < -0.1 ? -1 : 1;
      const steeringStrength = clamp(Math.abs(player.speed) / 5, 0.18, 1);
      player.yaw += steer * reverseMultiplier * steeringStrength * 1.55 * dt;

      const forwardX = -Math.sin(player.yaw);
      const forwardZ = -Math.cos(player.yaw);
      const distance = player.speed * dt;
      const candidateX = player.x + forwardX * distance;
      const candidateZ = player.z + forwardZ * distance;

      if (!blockedAt(candidateX, candidateZ)) {
        player.x = candidateX;
        player.z = candidateZ;
      } else {
        let moved = false;
        if (!blockedAt(candidateX, player.z)) {
          player.x = candidateX;
          moved = true;
        }
        if (!blockedAt(player.x, candidateZ)) {
          player.z = candidateZ;
          moved = true;
        }
        if (!moved) {
          player.speed *= -0.08;
          showImpact();
        } else {
          player.speed *= 0.72;
        }
      }

      playerModel.position.set(player.x, groundHeight(player.x, player.z), player.z);
      playerModel.rotation.set(0, player.yaw, 0);

      if (keyboardSteer !== 0) steeringElement.textContent = keyboardSteer > 0 ? 'Keyboard left' : 'Keyboard right';
      else if (serialConnected) steeringElement.textContent = `${potentiometerRaw} (${Math.round(-serialSteer * 100)}%)`;
      else steeringElement.textContent = 'Keyboard';

      speedElement.textContent = `${Math.round(Math.abs(player.speed) * 3.6)} km/h`;
    }

    const cameraTarget = new THREE.Vector3();
    const desiredCameraPosition = new THREE.Vector3();
    const desiredLookAt = new THREE.Vector3();

    function updateCamera(dt) {
      const behind = new THREE.Vector3(0, 5.2, 11.5).applyAxisAngle(new THREE.Vector3(0,1,0), player.yaw);
      const ahead = new THREE.Vector3(0, 1.0, -5.5).applyAxisAngle(new THREE.Vector3(0,1,0), player.yaw);
      desiredCameraPosition.set(player.x, groundHeight(player.x, player.z), player.z).add(behind);
      desiredLookAt.set(player.x, groundHeight(player.x, player.z), player.z).add(ahead);
      const smoothing = 1 - Math.pow(0.002, dt);
      camera.position.lerp(desiredCameraPosition, smoothing);
      cameraTarget.lerp(desiredLookAt, smoothing);
      camera.lookAt(cameraTarget);
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 1 / 24);
      const elapsed = clock.elapsedTime;
      updatePlayer(dt);
      updateTraffic(dt);
      updatePedestrians(dt, elapsed);
      updateCamera(dt);
      updateFoam(dt);
      riverUniforms.time.value = elapsed;
      waterfallUniforms.time.value = elapsed;
      if (impactTimer > 0) {
        impactTimer -= dt;
        if (impactTimer <= 0) impactElement.classList.add('hidden');
      }
      renderer.render(scene, camera);
    }

    resetPlayer();
    camera.position.set(player.x, 7, player.z + 11.5);
    cameraTarget.set(player.x, 1, player.z - 5);
    document.body.focus();
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
