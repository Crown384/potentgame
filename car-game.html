<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Potentiometer Car Adventure</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 overflow-hidden bg-sky-200 font-mono text-white">
  <div id="hud" class="pointer-events-none fixed inset-0 z-10">
    <div class="pointer-events-auto absolute left-4 top-4 w-[min(92vw,360px)] rounded-2xl border border-white/20 bg-slate-950/75 p-4 shadow-2xl backdrop-blur-md">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p class="text-xs uppercase tracking-[0.25em] text-cyan-300">Three.js driving demo</p>
          <h1 class="mt-1 text-xl font-black">POTENTIOMETER CAR</h1>
        </div>
        <div id="speed" class="rounded-xl bg-white/10 px-3 py-2 text-right text-sm font-bold">0 km/h</div>
      </div>

      <div class="mt-4 grid grid-cols-2 gap-2 text-xs">
        <div class="rounded-lg bg-white/5 p-2">
          <span class="block text-slate-400">Steering</span>
          <span id="steeringValue" class="font-bold text-cyan-300">Keyboard</span>
        </div>
        <div class="rounded-lg bg-white/5 p-2">
          <span class="block text-slate-400">Arduino</span>
          <span id="serialStatus" class="font-bold text-amber-300">Not connected</span>
        </div>
      </div>

      <button id="connectBtn" class="mt-3 w-full rounded-xl bg-cyan-300 px-4 py-3 text-sm font-black text-slate-950 shadow-lg shadow-cyan-300/20 transition hover:bg-white">
        CONNECT ARDUINO NANO
      </button>

      <div class="mt-3 grid grid-cols-2 gap-2 text-xs text-slate-300">
        <div class="rounded-lg border border-white/10 p-2">↑ Accelerate</div>
        <div class="rounded-lg border border-white/10 p-2">↓ Brake / reverse</div>
        <div class="rounded-lg border border-white/10 p-2">← → Steering</div>
        <div class="rounded-lg border border-white/10 p-2">R Reset car</div>
      </div>
    </div>

    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 rounded-full border border-white/20 bg-slate-950/70 px-4 py-2 text-center text-xs text-slate-200 backdrop-blur-md">
      Drive through the grassland and explore the waterfall valley.
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9fd8ff);
    scene.fog = new THREE.FogExp2(0x9fd8ff, 0.0017);

    const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 2500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.domElement.className = 'fixed inset-0 block';
    document.body.prepend(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xdff4ff, 0x356a2c, 2.2);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xfff4d2, 3.2);
    sun.position.set(-180, 260, -120);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -350;
    sun.shadow.camera.right = 350;
    sun.shadow.camera.top = 350;
    sun.shadow.camera.bottom = -350;
    scene.add(sun);

    const world = new THREE.Group();
    scene.add(world);

    function mesh(geometry, material, x = 0, y = 0, z = 0) {
      const object = new THREE.Mesh(geometry, material);
      object.position.set(x, y, z);
      object.castShadow = true;
      object.receiveShadow = true;
      world.add(object);
      return object;
    }

    const grassMaterial = new THREE.MeshStandardMaterial({ color: 0x4f9f45, roughness: 1 });
    const ground = mesh(new THREE.PlaneGeometry(1400, 1400), grassMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;

    const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x2f343b, roughness: 0.95 });
    const road = mesh(new THREE.PlaneGeometry(90, 1100), roadMaterial, 0, 0.03, 0);
    road.rotation.x = -Math.PI / 2;

    const shoulderMaterial = new THREE.MeshStandardMaterial({ color: 0xb79c6c, roughness: 1 });
    for (const x of [-51, 51]) {
      const shoulder = mesh(new THREE.PlaneGeometry(12, 1100), shoulderMaterial, x, 0.035, 0);
      shoulder.rotation.x = -Math.PI / 2;
    }

    const lineMaterial = new THREE.MeshStandardMaterial({ color: 0xf7e9a9, emissive: 0x443b16 });
    for (let z = -520; z <= 520; z += 34) {
      mesh(new THREE.BoxGeometry(2.2, 0.08, 18), lineMaterial, 0, 0.09, z);
    }

    function addTree(x, z, scale = 1) {
      const trunk = mesh(
        new THREE.CylinderGeometry(1.4 * scale, 1.8 * scale, 11 * scale, 8),
        new THREE.MeshStandardMaterial({ color: 0x6d4428, roughness: 1 }),
        x,
        5.5 * scale,
        z
      );
      const leaves = mesh(
        new THREE.ConeGeometry(7 * scale, 18 * scale, 9),
        new THREE.MeshStandardMaterial({ color: 0x226c3a, roughness: 0.9 }),
        x,
        17 * scale,
        z
      );
      trunk.castShadow = true;
      leaves.castShadow = true;
    }

    function addRock(x, z, scale = 1) {
      const rock = mesh(
        new THREE.DodecahedronGeometry(3.5 * scale, 0),
        new THREE.MeshStandardMaterial({ color: 0x6d7476, roughness: 1 }),
        x,
        2.1 * scale,
        z
      );
      rock.scale.y = 0.7;
      rock.rotation.set(Math.random(), Math.random(), Math.random());
    }

    for (let i = 0; i < 70; i++) {
      const side = Math.random() > 0.5 ? 1 : -1;
      const x = side * (85 + Math.random() * 470);
      const z = -620 + Math.random() * 1240;
      if (x > 190 && x < 430 && z > -360 && z < -80) continue;
      addTree(x, z, 0.7 + Math.random() * 0.8);
    }

    for (let i = 0; i < 35; i++) {
      addRock((Math.random() - 0.5) * 1100, (Math.random() - 0.5) * 1100, 0.5 + Math.random());
    }

    function addWaterfallValley() {
      const cliffMaterial = new THREE.MeshStandardMaterial({ color: 0x766955, roughness: 1 });
      const darkCliffMaterial = new THREE.MeshStandardMaterial({ color: 0x4f4a43, roughness: 1 });

      mesh(new THREE.BoxGeometry(250, 82, 78), cliffMaterial, 320, 40, -250);
      mesh(new THREE.BoxGeometry(68, 65, 150), darkCliffMaterial, 222, 31, -235);
      mesh(new THREE.BoxGeometry(68, 65, 150), darkCliffMaterial, 418, 31, -235);

      const riverMaterial = new THREE.MeshStandardMaterial({
        color: 0x2499c6,
        transparent: true,
        opacity: 0.82,
        roughness: 0.18,
        metalness: 0.05
      });

      const river = mesh(new THREE.PlaneGeometry(72, 230), riverMaterial, 320, 82.2, -365);
      river.rotation.x = -Math.PI / 2;

      const pool = mesh(new THREE.CircleGeometry(100, 48), riverMaterial, 320, 0.12, -145);
      pool.rotation.x = -Math.PI / 2;
      pool.scale.set(1.35, 1, 0.7);

      const waterfallMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x7fe7ff,
        transparent: true,
        opacity: 0.72,
        transmission: 0.2,
        roughness: 0.08,
        side: THREE.DoubleSide
      });

      const falls = [];
      for (let i = 0; i < 7; i++) {
        const strip = mesh(new THREE.PlaneGeometry(9, 84), waterfallMaterial, 293 + i * 9, 40, -210 + Math.sin(i) * 2);
        strip.rotation.y = Math.PI;
        falls.push(strip);
      }

      const mistCount = 500;
      const mistPositions = new Float32Array(mistCount * 3);
      for (let i = 0; i < mistCount; i++) {
        mistPositions[i * 3] = 320 + (Math.random() - 0.5) * 115;
        mistPositions[i * 3 + 1] = 2 + Math.random() * 24;
        mistPositions[i * 3 + 2] = -190 + (Math.random() - 0.5) * 80;
      }

      const mistGeometry = new THREE.BufferGeometry();
      mistGeometry.setAttribute('position', new THREE.BufferAttribute(mistPositions, 3));
      const mist = new THREE.Points(
        mistGeometry,
        new THREE.PointsMaterial({ color: 0xe6fbff, size: 2.5, transparent: true, opacity: 0.65, depthWrite: false })
      );
      scene.add(mist);

      return { falls, river, mist };
    }

    const waterfall = addWaterfallValley();

    function createCar() {
      const car = new THREE.Group();
      const red = new THREE.MeshStandardMaterial({ color: 0xe82d46, metalness: 0.25, roughness: 0.35 });
      const dark = new THREE.MeshStandardMaterial({ color: 0x15171c, roughness: 0.45 });
      const glass = new THREE.MeshPhysicalMaterial({ color: 0x8edbff, transparent: true, opacity: 0.65, roughness: 0.1 });

      const body = new THREE.Mesh(new THREE.BoxGeometry(4.8, 1.25, 9.2), red);
      body.position.y = 1.65;
      body.castShadow = true;
      car.add(body);

      const hood = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.55, 3.2), red);
      hood.position.set(0, 2.35, 2.25);
      hood.castShadow = true;
      car.add(hood);

      const cabin = new THREE.Mesh(new THREE.BoxGeometry(3.8, 1.55, 3.8), glass);
      cabin.position.set(0, 2.75, -0.7);
      cabin.castShadow = true;
      car.add(cabin);

      const bumper = new THREE.Mesh(new THREE.BoxGeometry(5, 0.35, 0.4), dark);
      bumper.position.set(0, 1.15, 4.75);
      car.add(bumper);

      const wheelGeometry = new THREE.CylinderGeometry(0.95, 0.95, 0.72, 18);
      const wheels = [];
      for (const x of [-2.45, 2.45]) {
        for (const z of [-2.9, 2.9]) {
          const wheel = new THREE.Mesh(wheelGeometry, dark);
          wheel.rotation.z = Math.PI / 2;
          wheel.position.set(x, 1.05, z);
          wheel.castShadow = true;
          car.add(wheel);
          wheels.push(wheel);
        }
      }

      const headlightMaterial = new THREE.MeshStandardMaterial({ color: 0xfff6bd, emissive: 0xffd86b, emissiveIntensity: 2 });
      for (const x of [-1.45, 1.45]) {
        const light = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.45, 0.15), headlightMaterial);
        light.position.set(x, 1.8, 4.66);
        car.add(light);
      }

      car.position.set(0, 0, -430);
      scene.add(car);
      return { car, wheels };
    }

    const vehicle = createCar();
    const car = vehicle.car;
    const wheels = vehicle.wheels;

    const keys = { up: false, down: false, left: false, right: false };
    let speed = 0;
    let heading = 0;
    let wheelSpin = 0;
    let potentiometerValue = null;
    let serialPort = null;

    const speedElement = document.getElementById('speed');
    const steeringElement = document.getElementById('steeringValue');
    const serialStatus = document.getElementById('serialStatus');
    const connectBtn = document.getElementById('connectBtn');

    function setKey(code, pressed) {
      if (code === 'ArrowUp') keys.up = pressed;
      if (code === 'ArrowDown') keys.down = pressed;
      if (code === 'ArrowLeft') keys.left = pressed;
      if (code === 'ArrowRight') keys.right = pressed;
      if (code === 'KeyR' && pressed) resetCar();
    }

    addEventListener('keydown', (event) => {
      if (event.code.startsWith('Arrow')) event.preventDefault();
      setKey(event.code, true);
    });

    addEventListener('keyup', (event) => setKey(event.code, false));

    function resetCar() {
      car.position.set(0, 0, -430);
      heading = 0;
      speed = 0;
      car.rotation.y = 0;
    }

    function normalizedPotSteering(value) {
      const centered = THREE.MathUtils.clamp((value - 512) / 512, -1, 1);
      const deadZone = 0.08;
      if (Math.abs(centered) < deadZone) return 0;
      return Math.sign(centered) * ((Math.abs(centered) - deadZone) / (1 - deadZone));
    }

    connectBtn.addEventListener('click', async () => {
      if (!('serial' in navigator)) {
        serialStatus.textContent = 'Web Serial unsupported';
        serialStatus.className = 'font-bold text-red-300';
        alert('Use desktop Chrome or Edge over HTTPS or localhost.');
        return;
      }

      try {
        serialPort = await navigator.serial.requestPort();
        await serialPort.open({ baudRate: 9600 });
        serialStatus.textContent = 'Connected';
        serialStatus.className = 'font-bold text-emerald-300';
        connectBtn.textContent = 'ARDUINO CONNECTED';
        connectBtn.disabled = true;
        connectBtn.className = 'mt-3 w-full rounded-xl bg-emerald-300 px-4 py-3 text-sm font-black text-slate-950 opacity-90';

        const decoder = new TextDecoderStream();
        serialPort.readable.pipeTo(decoder.writable).catch(() => {});
        const reader = decoder.readable.getReader();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop() ?? '';

          for (const line of lines) {
            const parsed = Number.parseInt(line.trim(), 10);
            if (Number.isFinite(parsed)) {
              potentiometerValue = THREE.MathUtils.clamp(parsed, 0, 1023);
            }
          }
        }
      } catch (error) {
        serialStatus.textContent = 'Connection failed';
        serialStatus.className = 'font-bold text-red-300';
        console.error(error);
      }
    });

    function getSteeringInput() {
      const keyboard = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
      if (keyboard !== 0) {
        steeringElement.textContent = keyboard < 0 ? 'Keyboard left' : 'Keyboard right';
        return keyboard;
      }

      if (potentiometerValue !== null) {
        const steering = normalizedPotSteering(potentiometerValue);
        steeringElement.textContent = `Pot ${potentiometerValue}`;
        return steering;
      }

      steeringElement.textContent = 'Keyboard';
      return 0;
    }

    function updateCar(delta) {
      const acceleration = 32;
      const braking = 48;
      const maxForwardSpeed = 58;
      const maxReverseSpeed = -20;

      if (keys.up) speed += acceleration * delta;
      if (keys.down) speed -= braking * delta;

      if (!keys.up && !keys.down) {
        speed *= Math.exp(-1.45 * delta);
        if (Math.abs(speed) < 0.03) speed = 0;
      }

      speed = THREE.MathUtils.clamp(speed, maxReverseSpeed, maxForwardSpeed);

      const steering = getSteeringInput();
      const speedRatio = THREE.MathUtils.clamp(Math.abs(speed) / 24, 0.16, 1);
      const direction = speed >= 0 ? 1 : -1;
      heading -= steering * 1.75 * speedRatio * direction * delta;

      const forward = new THREE.Vector3(Math.sin(heading), 0, Math.cos(heading));
      car.position.addScaledVector(forward, speed * delta);
      car.rotation.y = heading;

      car.position.x = THREE.MathUtils.clamp(car.position.x, -650, 650);
      car.position.z = THREE.MathUtils.clamp(car.position.z, -650, 650);

      wheelSpin += speed * delta * 0.8;
      for (const wheel of wheels) wheel.rotation.x = wheelSpin;

      speedElement.textContent = `${Math.round(Math.abs(speed) * 3.6)} km/h`;
    }

    const chasePosition = new THREE.Vector3();
    const lookTarget = new THREE.Vector3();

    function updateCamera(delta) {
      const forward = new THREE.Vector3(Math.sin(heading), 0, Math.cos(heading));
      chasePosition.copy(car.position).addScaledVector(forward, -17).add(new THREE.Vector3(0, 9.5, 0));
      const smoothing = 1 - Math.exp(-5.5 * delta);
      camera.position.lerp(chasePosition, smoothing);
      lookTarget.copy(car.position).addScaledVector(forward, 8).add(new THREE.Vector3(0, 2.2, 0));
      camera.lookAt(lookTarget);
    }

    const clock = new THREE.Clock();

    function animateWaterfall(time) {
      waterfall.falls.forEach((strip, index) => {
        strip.material.opacity = 0.58 + Math.sin(time * 4 + index) * 0.1;
        strip.position.y = 40 + Math.sin(time * 3 + index * 0.7) * 0.7;
      });
      waterfall.river.material.opacity = 0.75 + Math.sin(time * 2) * 0.05;
      waterfall.mist.rotation.y += 0.0015;
      const positions = waterfall.mist.geometry.attributes.position;
      for (let i = 0; i < positions.count; i++) {
        let y = positions.getY(i) + 0.035;
        if (y > 28) y = 2 + Math.random() * 3;
        positions.setY(i, y);
      }
      positions.needsUpdate = true;
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.04);
      const elapsed = clock.elapsedTime;
      updateCar(delta);
      updateCamera(delta);
      animateWaterfall(elapsed);
      renderer.render(scene, camera);
    }

    updateCamera(1);
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
