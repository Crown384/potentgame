<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Potentiometer City Driver</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 overflow-hidden bg-sky-200 font-mono text-white">
  <div class="pointer-events-none fixed inset-0 z-20">
    <section class="pointer-events-auto absolute left-4 top-4 w-[min(92vw,400px)] rounded-2xl border border-white/20 bg-slate-950/80 p-4 shadow-2xl backdrop-blur-xl">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p class="text-[10px] font-bold uppercase tracking-[0.28em] text-cyan-300">Three.js + Cannon physics</p>
          <h1 class="mt-1 text-xl font-black">CITY DRIVER</h1>
        </div>
        <div id="speed" class="min-w-24 rounded-xl bg-white/10 px-3 py-2 text-right text-sm font-black">0 km/h</div>
      </div>

      <div class="mt-4 grid grid-cols-3 gap-2 text-xs">
        <div class="rounded-xl bg-white/5 p-2">
          <span class="block text-slate-400">Steering</span>
          <span id="steeringValue" class="font-bold text-cyan-300">Keyboard</span>
        </div>
        <div class="rounded-xl bg-white/5 p-2">
          <span class="block text-slate-400">Arduino</span>
          <span id="serialStatus" class="font-bold text-amber-300">Offline</span>
        </div>
        <div class="rounded-xl bg-white/5 p-2">
          <span class="block text-slate-400">Traffic</span>
          <span id="trafficStatus" class="font-bold text-emerald-300">Yielding</span>
        </div>
      </div>

      <button id="connectBtn" class="mt-3 w-full rounded-xl bg-cyan-300 px-4 py-3 text-sm font-black text-slate-950 shadow-lg shadow-cyan-300/20 transition hover:bg-white">
        CONNECT ARDUINO NANO
      </button>

      <div class="mt-3 grid grid-cols-2 gap-2 text-[11px] text-slate-300">
        <div class="rounded-lg border border-white/10 p-2">↑ Accelerate</div>
        <div class="rounded-lg border border-white/10 p-2">↓ Brake / reverse</div>
        <div class="rounded-lg border border-white/10 p-2">← → Steering</div>
        <div class="rounded-lg border border-white/10 p-2">Space Handbrake</div>
        <div class="col-span-2 rounded-lg border border-white/10 p-2 text-center">R Reset vehicle</div>
      </div>
    </section>

    <div id="impact" class="absolute left-1/2 top-24 hidden -translate-x-1/2 rounded-full border border-red-300/40 bg-red-950/80 px-5 py-2 text-sm font-black text-red-200 shadow-xl backdrop-blur-md">
      IMPACT
    </div>

    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 rounded-full border border-white/20 bg-slate-950/75 px-5 py-2 text-center text-xs text-slate-200 backdrop-blur-md">
      Camera follows from behind. Civilian traffic slows and stops for you.
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js';
    import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const randomRange = (min, max) => min + Math.random() * (max - min);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ed8ff);
    scene.fog = new THREE.FogExp2(0xa8d8ee, 0.00135);

    const camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, 0.1, 2400);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.domElement.className = 'fixed inset-0 block';
    document.body.prepend(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xe8f7ff, 0x34592d, 2.1));
    const sun = new THREE.DirectionalLight(0xfff2d1, 4.1);
    sun.position.set(-180, 250, -130);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -420;
    sun.shadow.camera.right = 420;
    sun.shadow.camera.top = 420;
    sun.shadow.camera.bottom = -420;
    sun.shadow.camera.near = 20;
    sun.shadow.camera.far = 700;
    scene.add(sun);

    const physicsWorld = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
    physicsWorld.broadphase = new CANNON.SAPBroadphase(physicsWorld);
    physicsWorld.allowSleep = true;
    physicsWorld.solver.iterations = 14;
    physicsWorld.defaultContactMaterial.friction = 0.5;
    physicsWorld.defaultContactMaterial.restitution = 0.02;

    const roadPhysicsMaterial = new CANNON.Material('road');
    const carPhysicsMaterial = new CANNON.Material('car');
    physicsWorld.addContactMaterial(new CANNON.ContactMaterial(roadPhysicsMaterial, carPhysicsMaterial, {
      friction: 0.78,
      restitution: 0.02,
      contactEquationStiffness: 1e8
    }));

    const worldVisual = new THREE.Group();
    scene.add(worldVisual);

    const materials = {
      grass: new THREE.MeshStandardMaterial({ color: 0x4f9a48, roughness: 1 }),
      road: new THREE.MeshStandardMaterial({ color: 0x252b31, roughness: 0.95 }),
      sidewalk: new THREE.MeshStandardMaterial({ color: 0xa4adb3, roughness: 0.88 }),
      bridge: new THREE.MeshStandardMaterial({ color: 0x5b6670, roughness: 0.8 }),
      rail: new THREE.MeshStandardMaterial({ color: 0xdbe3e8, metalness: 0.6, roughness: 0.34 }),
      rock: new THREE.MeshStandardMaterial({ color: 0x585e5d, roughness: 1 }),
      trunk: new THREE.MeshStandardMaterial({ color: 0x654326, roughness: 1 }),
      leaf: new THREE.MeshStandardMaterial({ color: 0x297344, roughness: 1 }),
      yellow: new THREE.MeshStandardMaterial({ color: 0xf5df61, roughness: 0.75 }),
      white: new THREE.MeshStandardMaterial({ color: 0xf3f6f7, roughness: 0.75 })
    };

    function addMesh(geometry, material, position, rotation = new THREE.Euler(), parent = worldVisual) {
      const object = new THREE.Mesh(geometry, material);
      object.position.copy(position);
      object.rotation.copy(rotation);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function addStaticBox(size, position, material, rotation = new THREE.Euler(), visible = true) {
      const object = visible ? addMesh(new THREE.BoxGeometry(size.x, size.y, size.z), material, position, rotation) : null;
      const body = new CANNON.Body({ mass: 0, material: roadPhysicsMaterial });
      body.addShape(new CANNON.Box(new CANNON.Vec3(size.x / 2, size.y / 2, size.z / 2)));
      body.position.set(position.x, position.y, position.z);
      body.quaternion.setFromEuler(rotation.x, rotation.y, rotation.z, 'XYZ');
      physicsWorld.addBody(body);
      return { object, body };
    }

    function addStaticRock(radius, position, scale = new THREE.Vector3(1, 1, 1)) {
      const rock = addMesh(new THREE.IcosahedronGeometry(radius, 2), materials.rock, position);
      rock.scale.copy(scale);
      const body = new CANNON.Body({ mass: 0, material: roadPhysicsMaterial });
      body.addShape(new CANNON.Sphere(radius * Math.max(scale.x, scale.y, scale.z) * 0.8));
      body.position.set(position.x, position.y, position.z);
      physicsWorld.addBody(body);
    }

    // Land, roads and river channel.
    addStaticBox(new THREE.Vector3(760, 8, 360), new THREE.Vector3(0, -4, -210), materials.grass);
    addStaticBox(new THREE.Vector3(760, 8, 360), new THREE.Vector3(0, -4, 210), materials.grass);
    addStaticBox(new THREE.Vector3(760, 2, 62), new THREE.Vector3(0, -8, 0), materials.rock);

    const roadWidth = 27;
    addStaticBox(new THREE.Vector3(roadWidth, 0.18, 350), new THREE.Vector3(0, 0.09, -205), materials.road);
    addStaticBox(new THREE.Vector3(roadWidth, 0.18, 350), new THREE.Vector3(0, 0.09, 205), materials.road);
    addStaticBox(new THREE.Vector3(720, 0.18, roadWidth), new THREE.Vector3(0, 0.09, -120), materials.road);
    addStaticBox(new THREE.Vector3(720, 0.18, roadWidth), new THREE.Vector3(0, 0.09, 120), materials.road);

    for (const side of [-1, 1]) {
      addStaticBox(new THREE.Vector3(5, 0.4, 350), new THREE.Vector3(side * 16.2, 0.2, -205), materials.sidewalk);
      addStaticBox(new THREE.Vector3(5, 0.4, 350), new THREE.Vector3(side * 16.2, 0.2, 205), materials.sidewalk);
      for (const z of [-120, 120]) {
        addStaticBox(new THREE.Vector3(720, 0.4, 5), new THREE.Vector3(0, 0.2, z + side * 16.2), materials.sidewalk);
      }
    }

    // Bridge and stable ramps.
    addStaticBox(new THREE.Vector3(31, 2.2, 64), new THREE.Vector3(0, 1.1, 0), materials.bridge);
    const rampAngle = 0.105;
    addStaticBox(new THREE.Vector3(31, 1.6, 25), new THREE.Vector3(0, 0.75, -43), materials.bridge, new THREE.Euler(-rampAngle, 0, 0));
    addStaticBox(new THREE.Vector3(31, 1.6, 25), new THREE.Vector3(0, 0.75, 43), materials.bridge, new THREE.Euler(rampAngle, 0, 0));
    for (const side of [-1, 1]) {
      addStaticBox(new THREE.Vector3(0.7, 2.1, 88), new THREE.Vector3(side * 15, 3.1, 0), materials.rail);
    }

    function roadMark(x, y, z, width, depth, material = materials.yellow) {
      const mark = addMesh(new THREE.BoxGeometry(width, 0.04, depth), material, new THREE.Vector3(x, y, z));
      mark.castShadow = false;
    }
    for (let z = -360; z <= 360; z += 15) {
      if (Math.abs(z) > 58) roadMark(0, 0.21, z, 0.34, 7);
    }
    for (let x = -350; x <= 350; x += 15) {
      roadMark(x, 0.21, -120, 7, 0.34);
      roadMark(x, 0.21, 120, 7, 0.34);
    }
    for (let z = -28; z <= 28; z += 12) roadMark(0, 2.22, z, 0.34, 6);

    // River.
    const riverUniforms = { time: { value: 0 } };
    const riverMaterial = new THREE.ShaderMaterial({
      transparent: true,
      side: THREE.DoubleSide,
      uniforms: riverUniforms,
      vertexShader: `
        varying vec2 vUv;
        uniform float time;
        void main() {
          vUv = uv;
          vec3 p = position;
          p.z += sin(p.x * 0.07 + time * 2.0) * 0.3;
          p.z += sin(p.y * 0.16 - time * 1.3) * 0.18;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform float time;
        void main() {
          float a = sin(vUv.x * 96.0 + time * 3.2) * 0.5 + 0.5;
          float b = sin(vUv.y * 42.0 - time * 2.2) * 0.5 + 0.5;
          vec3 deep = vec3(0.01, 0.16, 0.31);
          vec3 bright = vec3(0.04, 0.52, 0.72);
          vec3 colour = mix(deep, bright, a * 0.32 + b * 0.23);
          colour += smoothstep(0.86, 1.0, a * b) * 0.28;
          gl_FragColor = vec4(colour, 0.9);
        }
      `
    });
    const river = new THREE.Mesh(new THREE.PlaneGeometry(760, 60, 100, 20), riverMaterial);
    river.rotation.x = -Math.PI / 2;
    river.position.y = -2.2;
    worldVisual.add(river);

    // Waterfall with layered water, foam and mist.
    const waterfallUniforms = { time: { value: 0 } };
    const waterfallMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      uniforms: waterfallUniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform float time;
        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
        void main() {
          float streak1 = sin(vUv.x * 75.0 - vUv.y * 22.0 - time * 10.0);
          float streak2 = sin(vUv.x * 33.0 + vUv.y * 86.0 + time * 12.0);
          float noise = hash(floor(vec2(vUv.x * 40.0, (vUv.y - time) * 65.0)));
          float edge = smoothstep(0.0, 0.1, vUv.x) * smoothstep(1.0, 0.9, vUv.x);
          float alpha = edge * clamp(0.48 + streak1 * 0.2 + streak2 * 0.12 + noise * 0.24, 0.0, 0.9);
          vec3 water = mix(vec3(0.05,0.36,0.62), vec3(0.92,0.99,1.0), 0.58 + streak1 * 0.2);
          gl_FragColor = vec4(water, alpha);
        }
      `
    });
    const waterfall = new THREE.Mesh(new THREE.PlaneGeometry(37, 36, 30, 40), waterfallMaterial);
    waterfall.rotation.y = Math.PI / 2;
    waterfall.position.set(-250, 12.5, 0);
    worldVisual.add(waterfall);
    const waterfallBack = waterfall.clone();
    waterfallBack.position.x -= 0.8;
    waterfallBack.scale.set(0.93, 1, 0.93);
    worldVisual.add(waterfallBack);
    addStaticBox(new THREE.Vector3(24, 32, 84), new THREE.Vector3(-261, 8, 0), materials.rock);
    for (let i = 0; i < 16; i++) {
      addStaticRock(randomRange(2.5, 6), new THREE.Vector3(randomRange(-270, -240), randomRange(-1, 24), randomRange(-36, 36)), new THREE.Vector3(1.2, 0.8, 1));
    }

    const foamCount = 380;
    const foamPositions = new Float32Array(foamCount * 3);
    const foamVelocity = [];
    for (let i = 0; i < foamCount; i++) {
      const p = i * 3;
      foamPositions[p] = randomRange(-252, -240);
      foamPositions[p + 1] = randomRange(-2.4, 2.8);
      foamPositions[p + 2] = randomRange(-19, 19);
      foamVelocity.push(new THREE.Vector3(randomRange(-0.4, 1.8), randomRange(0.8, 4.5), randomRange(-1.6, 1.6)));
    }
    const foamGeometry = new THREE.BufferGeometry();
    foamGeometry.setAttribute('position', new THREE.BufferAttribute(foamPositions, 3));
    const foam = new THREE.Points(foamGeometry, new THREE.PointsMaterial({
      color: 0xecfcff,
      size: 1.25,
      transparent: true,
      opacity: 0.58,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    }));
    worldVisual.add(foam);

    function updateFoam(dt) {
      const positions = foamGeometry.attributes.position.array;
      for (let i = 0; i < foamCount; i++) {
        const p = i * 3;
        const velocity = foamVelocity[i];
        positions[p] += velocity.x * dt;
        positions[p + 1] += velocity.y * dt;
        positions[p + 2] += velocity.z * dt;
        velocity.y -= 2.7 * dt;
        if (positions[p + 1] < -2.8 || positions[p] > -234) {
          positions[p] = randomRange(-252, -243);
          positions[p + 1] = randomRange(-2.2, 0.7);
          positions[p + 2] = randomRange(-18, 18);
          velocity.set(randomRange(0.1, 2), randomRange(1.2, 4.7), randomRange(-1.7, 1.7));
        }
      }
      foamGeometry.attributes.position.needsUpdate = true;
    }

    // Skyscrapers.
    function windowTexture(seed) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 256;
      const context = canvas.getContext('2d');
      context.fillStyle = '#17212b';
      context.fillRect(0, 0, 128, 256);
      for (let y = 8; y < 250; y += 16) {
        for (let x = 7; x < 124; x += 15) {
          const lit = Math.sin(x * 9.2 + y * 4.7 + seed) > -0.18;
          context.fillStyle = lit ? (Math.random() > 0.35 ? '#f1d58c' : '#7ed8ff') : '#263442';
          context.fillRect(x, y, 8, 9);
        }
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }
    const buildingTextures = Array.from({ length: 6 }, (_, index) => windowTexture(index * 19));

    function addBuilding(x, z, width, depth, height, colour, textureIndex) {
      const texture = buildingTextures[textureIndex % buildingTextures.length];
      const material = new THREE.MeshStandardMaterial({
        color: colour,
        map: texture,
        emissive: new THREE.Color(0x203447),
        emissiveMap: texture,
        emissiveIntensity: 0.22,
        roughness: 0.68,
        metalness: 0.18
      });
      addStaticBox(new THREE.Vector3(width, height, depth), new THREE.Vector3(x, height / 2, z), material);
      if (height > 70) {
        addMesh(new THREE.BoxGeometry(width * 0.42, 4, depth * 0.42), materials.rail, new THREE.Vector3(x, height + 2, z));
      }
    }

    const buildingColours = [0x71849a, 0x8a6f74, 0x687681, 0x556b7a, 0x8b816e, 0x6f7088];
    const blocks = [
      [-80, -250], [-150, -250], [90, -250], [165, -250],
      [-85, -165], [-165, -165], [90, -165], [170, -165],
      [-85, 165], [-165, 165], [90, 165], [170, 165],
      [-80, 250], [-155, 250], [90, 250], [165, 250],
      [-255, -180], [255, -180], [-255, 185], [255, 185]
    ];
    blocks.forEach(([x, z], index) => {
      addBuilding(x, z, randomRange(30, 48), randomRange(34, 52), randomRange(45, 130), buildingColours[index % buildingColours.length], index);
    });

    // Trees and solid rocks.
    function addTree(x, z) {
      addMesh(new THREE.CylinderGeometry(0.45, 0.7, 6, 8), materials.trunk, new THREE.Vector3(x, 3, z));
      addMesh(new THREE.ConeGeometry(3.3, 7, 10), materials.leaf, new THREE.Vector3(x, 8.2, z));
    }
    for (let z = -330; z <= 330; z += 38) {
      if (Math.abs(z) > 60) {
        addTree(-24, z);
        addTree(24, z + 12);
      }
    }
    const rockPositions = [
      [-74, -74, 4], [78, -72, 5], [-88, 78, 4.5], [94, 76, 5],
      [-150, -150, 4.2], [145, 160, 5.6], [-205, 72, 6], [210, -70, 5.2]
    ];
    rockPositions.forEach(([x, z, radius]) => addStaticRock(radius, new THREE.Vector3(x, radius * 0.72, z), new THREE.Vector3(1.2, 0.82, 1)));

    function addStreetLight(x, z) {
      addMesh(new THREE.CylinderGeometry(0.16, 0.24, 8, 8), materials.rail, new THREE.Vector3(x, 4, z));
      const lamp = new THREE.MeshStandardMaterial({ color: 0xffe7b3, emissive: 0xffcc72, emissiveIntensity: 2.1 });
      addMesh(new THREE.SphereGeometry(0.5, 12, 8), lamp, new THREE.Vector3(x, 8.2, z));
    }
    for (let z = -330; z <= 330; z += 46) {
      if (Math.abs(z) > 58) {
        addStreetLight(-19.5, z);
        addStreetLight(19.5, z);
      }
    }

    function createCarModel(colour = 0xe31e36, traffic = false) {
      const group = new THREE.Group();
      const paint = new THREE.MeshPhysicalMaterial({ color: colour, metalness: 0.62, roughness: 0.24, clearcoat: 1, clearcoatRoughness: 0.18 });
      const trim = new THREE.MeshStandardMaterial({ color: 0x101419, metalness: 0.6, roughness: 0.38 });
      const glass = new THREE.MeshPhysicalMaterial({ color: 0x6ca5c5, roughness: 0.08, transparent: true, opacity: 0.68 });
      const frontLight = new THREE.MeshStandardMaterial({ color: 0xeaf8ff, emissive: 0xbceaff, emissiveIntensity: 2.1 });
      const rearLight = new THREE.MeshStandardMaterial({ color: 0xff2438, emissive: 0xff1228, emissiveIntensity: 1.7 });

      const base = addMesh(new THREE.BoxGeometry(2.25, 0.62, 4.6), paint, new THREE.Vector3(0, 0.2, 0), new THREE.Euler(), group);
      const hood = addMesh(new THREE.BoxGeometry(2.04, 0.34, 1.45), paint, new THREE.Vector3(0, 0.66, -1.46), new THREE.Euler(-0.06, 0, 0), group);
      const cabin = addMesh(new THREE.BoxGeometry(1.8, 0.82, 1.92), glass, new THREE.Vector3(0, 1.03, 0.18), new THREE.Euler(), group);
      addMesh(new THREE.BoxGeometry(1.64, 0.16, 1.3), paint, new THREE.Vector3(0, 1.5, 0.22), new THREE.Euler(), group);
      addMesh(new THREE.BoxGeometry(2.17, 0.25, 0.23), trim, new THREE.Vector3(0, 0.06, -2.35), new THREE.Euler(), group);
      addMesh(new THREE.BoxGeometry(2.17, 0.25, 0.23), trim, new THREE.Vector3(0, 0.06, 2.35), new THREE.Euler(), group);
      addMesh(new THREE.BoxGeometry(0.92, 0.28, 0.1), trim, new THREE.Vector3(0, 0.32, -2.34), new THREE.Euler(), group);
      for (const x of [-0.72, 0.72]) {
        addMesh(new THREE.BoxGeometry(0.55, 0.23, 0.08), frontLight, new THREE.Vector3(x, 0.52, -2.33), new THREE.Euler(), group);
        addMesh(new THREE.BoxGeometry(0.52, 0.22, 0.08), rearLight, new THREE.Vector3(x, 0.5, 2.33), new THREE.Euler(), group);
      }
      if (!traffic) {
        for (const side of [-1, 1]) addMesh(new THREE.BoxGeometry(0.24, 0.17, 0.38), paint, new THREE.Vector3(side * 1.2, 1.03, -0.12), new THREE.Euler(), group);
      }
      const tyreMaterial = new THREE.MeshStandardMaterial({ color: 0x111317, roughness: 0.76, metalness: 0.16 });
      const hubMaterial = new THREE.MeshStandardMaterial({ color: 0xc0c7cb, metalness: 0.9, roughness: 0.25 });
      for (const x of [-1.08, 1.08]) {
        for (const z of [-1.48, 1.48]) {
          const wheel = new THREE.Group();
          const tyre = new THREE.Mesh(new THREE.CylinderGeometry(0.47, 0.47, 0.34, 20).rotateZ(Math.PI / 2), tyreMaterial);
          const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.23, 0.36, 14).rotateZ(Math.PI / 2), hubMaterial);
          wheel.add(tyre, hub);
          wheel.position.set(x, -0.2, z);
          group.add(wheel);
        }
      }
      group.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      scene.add(group);
      return group;
    }

    // Stable player physics: real collisions, gravity and friction, but roll/pitch are locked.
    const playerBody = new CANNON.Body({
      mass: 1200,
      material: carPhysicsMaterial,
      linearDamping: 0.18,
      angularDamping: 0.9
    });
    playerBody.addShape(new CANNON.Box(new CANNON.Vec3(1.08, 0.52, 2.25)), new CANNON.Vec3(0, -0.15, 0));
    playerBody.position.set(5.8, 2.4, -255);
    playerBody.angularFactor.set(0, 1, 0);
    playerBody.allowSleep = false;
    physicsWorld.addBody(playerBody);
    const playerModel = createCarModel(0xe31e36);
    let playerYaw = 0;

    // Traffic cars are kinematic but now behave like careful civilians.
    const trafficCars = [];
    const trafficColours = [0x1976d2, 0xf2b705, 0x16a085, 0xf1f3f5, 0x6f42c1, 0x252a34, 0xe85d3f];

    function bridgeHeight(z) {
      const absoluteZ = Math.abs(z);
      if (absoluteZ <= 31) return 3.25;
      if (absoluteZ < 55) return 1.12 + ((55 - absoluteZ) / 24) * 2.13;
      return 1.12;
    }

    function addTrafficCar(route, offset, direction, speed, colour) {
      const model = createCarModel(colour, true);
      model.scale.set(0.92, 0.92, 0.92);
      const body = new CANNON.Body({
        mass: 0,
        type: CANNON.Body.KINEMATIC,
        material: carPhysicsMaterial,
        shape: new CANNON.Box(new CANNON.Vec3(1.02, 0.58, 2.12))
      });
      body.allowSleep = false;
      physicsWorld.addBody(body);
      trafficCars.push({ route, offset, direction, baseSpeed: speed, currentSpeed: speed, body, model });
    }

    for (let i = 0; i < 12; i++) {
      const direction = i % 2 === 0 ? 1 : -1;
      addTrafficCar('vertical', -330 + i * 58, direction, randomRange(8, 13), trafficColours[i % trafficColours.length]);
    }
    for (let i = 0; i < 10; i++) {
      const direction = i % 2 === 0 ? 1 : -1;
      addTrafficCar(i < 5 ? 'horizontalNorth' : 'horizontalSouth', -330 + (i % 5) * 135, direction, randomRange(7, 11), trafficColours[(i + 3) % trafficColours.length]);
    }

    function safeSpeedForGap(gap, baseSpeed) {
      if (gap <= 8) return 0;
      if (gap >= 30) return baseSpeed;
      return baseSpeed * ((gap - 8) / 22);
    }

    function playerGapAhead(car) {
      if (car.route === 'vertical') {
        const laneX = car.direction > 0 ? -6.4 : 6.4;
        if (Math.abs(playerBody.position.x - laneX) > 5.2) return Infinity;
        return car.direction * (playerBody.position.z - car.body.position.z);
      }
      const streetZ = car.route === 'horizontalNorth' ? 120 : -120;
      const laneZ = streetZ + (car.direction > 0 ? -6.2 : 6.2);
      if (Math.abs(playerBody.position.z - laneZ) > 5.2) return Infinity;
      return car.direction * (playerBody.position.x - car.body.position.x);
    }

    function trafficGapAhead(car) {
      let best = Infinity;
      for (const other of trafficCars) {
        if (other === car || other.route !== car.route || other.direction !== car.direction) continue;
        const gap = car.route === 'vertical'
          ? car.direction * (other.body.position.z - car.body.position.z)
          : car.direction * (other.body.position.x - car.body.position.x);
        if (gap > 0 && gap < best) best = gap;
      }
      return best;
    }

    function updateTraffic(dt) {
      let yieldingCount = 0;
      for (const car of trafficCars) {
        const playerGap = playerGapAhead(car);
        const vehicleGap = trafficGapAhead(car);
        let targetSpeed = car.baseSpeed;
        if (playerGap > 0 && playerGap < 34) targetSpeed = Math.min(targetSpeed, safeSpeedForGap(playerGap, car.baseSpeed));
        if (vehicleGap > 0 && vehicleGap < 30) targetSpeed = Math.min(targetSpeed, safeSpeedForGap(vehicleGap, car.baseSpeed));
        if (targetSpeed < car.baseSpeed * 0.35) yieldingCount++;
        const response = targetSpeed < car.currentSpeed ? 5.5 : 1.5;
        car.currentSpeed += (targetSpeed - car.currentSpeed) * Math.min(1, dt * response);
        if (targetSpeed === 0 && car.currentSpeed < 0.2) car.currentSpeed = 0;

        if (car.route === 'vertical') {
          const laneX = car.direction > 0 ? -6.4 : 6.4;
          if (!Number.isFinite(car.body.position.z) || car.body.position.lengthSquared() === 0) {
            car.body.position.set(laneX, bridgeHeight(car.offset), car.offset);
          }
          let z = car.body.position.z + car.direction * car.currentSpeed * dt;
          if (z > 350) z = -350;
          if (z < -350) z = 350;
          car.body.position.set(laneX, bridgeHeight(z), z);
          car.body.velocity.set(0, 0, car.direction * car.currentSpeed);
          car.body.quaternion.setFromEuler(0, car.direction > 0 ? Math.PI : 0, 0);
        } else {
          const streetZ = car.route === 'horizontalNorth' ? 120 : -120;
          const laneZ = streetZ + (car.direction > 0 ? -6.2 : 6.2);
          if (!Number.isFinite(car.body.position.x) || car.body.position.lengthSquared() === 0) {
            car.body.position.set(car.offset, 1.12, laneZ);
          }
          let x = car.body.position.x + car.direction * car.currentSpeed * dt;
          if (x > 350) x = -350;
          if (x < -350) x = 350;
          car.body.position.set(x, 1.12, laneZ);
          car.body.velocity.set(car.direction * car.currentSpeed, 0, 0);
          car.body.quaternion.setFromEuler(0, car.direction > 0 ? -Math.PI / 2 : Math.PI / 2, 0);
        }
        car.model.position.copy(car.body.position);
        car.model.quaternion.copy(car.body.quaternion);
      }
      document.getElementById('trafficStatus').textContent = yieldingCount > 0 ? `${yieldingCount} stopped` : 'Yielding';
    }

    // Pedestrians walk on sidewalks.
    const pedestrians = [];
    const skinColours = [0x7a4c2f, 0x9b6847, 0xc58b64, 0x5c3826, 0xd6a27e];
    const clothingColours = [0x2364aa, 0xe4572e, 0x25a18e, 0x6a4c93, 0xf3a712, 0x202c59];

    function createPerson(index) {
      const group = new THREE.Group();
      const skin = new THREE.MeshStandardMaterial({ color: skinColours[index % skinColours.length], roughness: 0.88 });
      const shirt = new THREE.MeshStandardMaterial({ color: clothingColours[index % clothingColours.length], roughness: 0.84 });
      const dark = new THREE.MeshStandardMaterial({ color: 0x20242a, roughness: 0.9 });
      const torso = addMesh(new THREE.CapsuleGeometry(0.34, 0.86, 5, 9), shirt, new THREE.Vector3(0, 1.55, 0), new THREE.Euler(), group);
      addMesh(new THREE.SphereGeometry(0.3, 12, 10), skin, new THREE.Vector3(0, 2.5, 0), new THREE.Euler(), group);
      const leftLeg = addMesh(new THREE.CapsuleGeometry(0.12, 0.75, 4, 7), dark, new THREE.Vector3(-0.16, 0.63, 0), new THREE.Euler(), group);
      const rightLeg = addMesh(new THREE.CapsuleGeometry(0.12, 0.75, 4, 7), dark, new THREE.Vector3(0.16, 0.63, 0), new THREE.Euler(), group);
      const leftArm = addMesh(new THREE.CapsuleGeometry(0.09, 0.65, 4, 7), skin, new THREE.Vector3(-0.48, 1.58, 0), new THREE.Euler(), group);
      const rightArm = addMesh(new THREE.CapsuleGeometry(0.09, 0.65, 4, 7), skin, new THREE.Vector3(0.48, 1.58, 0), new THREE.Euler(), group);
      scene.add(group);
      return { group, leftLeg, rightLeg, leftArm, rightArm };
    }

    function addPedestrian(route, offset, direction, speed, index) {
      const visuals = createPerson(index);
      const body = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC, shape: new CANNON.Sphere(0.48) });
      body.allowSleep = false;
      physicsWorld.addBody(body);
      pedestrians.push({ route, offset, direction, speed, body, ...visuals, phase: Math.random() * Math.PI * 2 });
    }

    for (let i = 0; i < 24; i++) addPedestrian('avenue', -320 + i * 27, i % 2 === 0 ? 1 : -1, randomRange(0.9, 1.55), i);
    for (let i = 0; i < 16; i++) addPedestrian(i < 8 ? 'crossNorth' : 'crossSouth', -300 + (i % 8) * 84, i % 2 === 0 ? 1 : -1, randomRange(0.85, 1.4), i + 30);

    function updatePedestrians(dt, elapsed) {
      pedestrians.forEach((person, index) => {
        if (person.route === 'avenue') {
          const sideX = index % 2 === 0 ? -16.2 : 16.2;
          let z = person.body.position.z || person.offset;
          z += person.direction * person.speed * dt;
          if (z > 342) z = -342;
          if (z < -342) z = 342;
          person.body.position.set(sideX, 0.72, z);
          person.group.rotation.y = person.direction > 0 ? Math.PI : 0;
        } else {
          const streetZ = person.route === 'crossNorth' ? 120 : -120;
          const sideZ = streetZ + (index % 2 === 0 ? -16.2 : 16.2);
          let x = person.body.position.x || person.offset;
          x += person.direction * person.speed * dt;
          if (x > 342) x = -342;
          if (x < -342) x = 342;
          person.body.position.set(x, 0.72, sideZ);
          person.group.rotation.y = person.direction > 0 ? -Math.PI / 2 : Math.PI / 2;
        }
        person.group.position.copy(person.body.position);
        const stride = Math.sin(elapsed * 7 * person.speed + person.phase) * 0.52;
        person.leftLeg.rotation.x = stride;
        person.rightLeg.rotation.x = -stride;
        person.leftArm.rotation.x = -stride * 0.7;
        person.rightArm.rotation.x = stride * 0.7;
      });
    }

    // Controls and Arduino.
    const keys = new Set();
    let serialPort = null;
    let serialConnected = false;
    let potentiometerRaw = 512;
    let potentiometerSteer = 0;
    const speedElement = document.getElementById('speed');
    const steeringElement = document.getElementById('steeringValue');
    const serialStatus = document.getElementById('serialStatus');
    const connectButton = document.getElementById('connectBtn');
    const impactElement = document.getElementById('impact');

    addEventListener('keydown', (event) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(event.code)) event.preventDefault();
      keys.add(event.code);
      if (event.code === 'KeyR') resetPlayer();
    });
    addEventListener('keyup', (event) => keys.delete(event.code));

    async function connectArduino() {
      if (!('serial' in navigator)) {
        alert('Web Serial is unavailable. Use desktop Chrome or Edge through HTTPS or localhost.');
        return;
      }
      try {
        serialPort = await navigator.serial.requestPort();
        await serialPort.open({ baudRate: 9600 });
        serialConnected = true;
        serialStatus.textContent = 'Connected';
        serialStatus.className = 'font-bold text-emerald-300';
        connectButton.textContent = 'ARDUINO CONNECTED';
        connectButton.disabled = true;
        connectButton.classList.add('opacity-70');
        const decoder = new TextDecoderStream();
        serialPort.readable.pipeTo(decoder.writable).catch(() => {});
        const reader = decoder.readable.getReader();
        let buffer = '';
        while (serialConnected) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop() ?? '';
          for (const line of lines) {
            const parsed = Number.parseInt(line.trim(), 10);
            if (!Number.isNaN(parsed)) {
              potentiometerRaw = clamp(parsed, 0, 1023);
              let normalised = (potentiometerRaw - 511.5) / 511.5;
              if (Math.abs(normalised) < 0.075) normalised = 0;
              potentiometerSteer = clamp(normalised, -1, 1);
            }
          }
        }
      } catch (error) {
        serialConnected = false;
        serialStatus.textContent = 'Connection failed';
        serialStatus.className = 'font-bold text-red-300';
        connectButton.disabled = false;
        connectButton.textContent = 'RETRY ARDUINO CONNECTION';
        alert(`Serial connection failed: ${error.message}`);
      }
    }
    connectButton.addEventListener('click', connectArduino);

    let impactTimer = 0;
    playerBody.addEventListener('collide', (event) => {
      const impact = Math.abs(event.contact.getImpactVelocityAlongNormal());
      if (impact > 4.5) {
        impactElement.textContent = impact > 10 ? 'HEAVY IMPACT' : 'IMPACT';
        impactElement.classList.remove('hidden');
        impactTimer = 0.7;
      }
    });

    function resetPlayer() {
      playerBody.position.set(5.8, 2.5, -255);
      playerBody.velocity.setZero();
      playerBody.angularVelocity.setZero();
      playerYaw = 0;
      playerBody.quaternion.setFromEuler(0, playerYaw, 0);
      playerBody.wakeUp();
    }

    function horizontalSpeed() {
      return Math.hypot(playerBody.velocity.x, playerBody.velocity.z);
    }

    function updatePlayerControls(dt) {
      const keyboardSteer = (keys.has('ArrowLeft') ? -1 : 0) + (keys.has('ArrowRight') ? 1 : 0);
      const steerInput = keyboardSteer !== 0 ? keyboardSteer : (serialConnected ? potentiometerSteer : 0);
      const speed = horizontalSpeed();
      const localForward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerYaw);
      const signedForwardSpeed = playerBody.velocity.x * localForward.x + playerBody.velocity.z * localForward.z;

      let throttle = 0;
      let brake = false;
      if (keys.has('ArrowUp')) throttle = 1;
      if (keys.has('ArrowDown')) {
        if (signedForwardSpeed > 1.5) brake = true;
        else throttle = -0.58;
      }
      if (keys.has('Space')) brake = true;

      const steerStrength = clamp(speed / 5, 0.18, 1) * (signedForwardSpeed < -0.5 ? -1 : 1);
      playerYaw += steerInput * steerStrength * 1.55 * dt;
      playerBody.quaternion.setFromEuler(0, playerYaw, 0);
      playerBody.angularVelocity.set(0, 0, 0);

      if (throttle !== 0) {
        const force = 7100 * throttle;
        playerBody.force.x += localForward.x * force;
        playerBody.force.z += localForward.z * force;
      }

      const drag = brake ? 0.82 : 0.992;
      playerBody.velocity.x *= Math.pow(drag, dt * 60);
      playerBody.velocity.z *= Math.pow(drag, dt * 60);
      if (!keys.has('ArrowUp') && !keys.has('ArrowDown')) {
        playerBody.velocity.x *= Math.pow(0.985, dt * 60);
        playerBody.velocity.z *= Math.pow(0.985, dt * 60);
      }

      const maxForward = throttle < 0 ? 11 : 31;
      const currentHorizontal = horizontalSpeed();
      if (currentHorizontal > maxForward) {
        const scale = maxForward / currentHorizontal;
        playerBody.velocity.x *= scale;
        playerBody.velocity.z *= scale;
      }

      // Extra upright protection prevents falling or flipping.
      playerBody.angularFactor.set(0, 1, 0);
      playerBody.angularVelocity.x = 0;
      playerBody.angularVelocity.z = 0;
      playerBody.quaternion.setFromEuler(0, playerYaw, 0);

      if (keyboardSteer !== 0) {
        steeringElement.textContent = keyboardSteer < 0 ? 'Keyboard left' : 'Keyboard right';
      } else if (serialConnected) {
        steeringElement.textContent = `${potentiometerRaw} (${Math.round(steerInput * 100)}%)`;
      } else {
        steeringElement.textContent = 'Keyboard';
      }
    }

    const cameraTarget = new THREE.Vector3();
    const desiredCameraPosition = new THREE.Vector3();
    const desiredLookAt = new THREE.Vector3();

    function syncPlayerVisual() {
      playerModel.position.copy(playerBody.position);
      playerModel.quaternion.copy(playerBody.quaternion);
    }

    function updateCamera(dt) {
      // Car front is negative Z. Positive Z is therefore behind the car.
      const behind = new THREE.Vector3(0, 5.2, 11.5).applyQuaternion(playerModel.quaternion);
      const ahead = new THREE.Vector3(0, 1.0, -5.5).applyQuaternion(playerModel.quaternion);
      desiredCameraPosition.copy(playerModel.position).add(behind);
      desiredLookAt.copy(playerModel.position).add(ahead);
      const smoothing = 1 - Math.pow(0.002, dt);
      camera.position.lerp(desiredCameraPosition, smoothing);
      cameraTarget.lerp(desiredLookAt, smoothing);
      camera.lookAt(cameraTarget);
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 1 / 24);
      const elapsed = clock.elapsedTime;
      updatePlayerControls(dt);
      updateTraffic(dt);
      updatePedestrians(dt, elapsed);
      physicsWorld.step(1 / 60, dt, 4);

      // Upright recovery after collision or numerical instability.
      if (Math.abs(playerBody.quaternion.x) > 0.02 || Math.abs(playerBody.quaternion.z) > 0.02) {
        playerBody.quaternion.setFromEuler(0, playerYaw, 0);
        playerBody.angularVelocity.x = 0;
        playerBody.angularVelocity.z = 0;
      }

      syncPlayerVisual();
      updateCamera(dt);
      updateFoam(dt);
      riverUniforms.time.value = elapsed;
      waterfallUniforms.time.value = elapsed;
      speedElement.textContent = `${Math.round(horizontalSpeed() * 3.6)} km/h`;

      if (impactTimer > 0) {
        impactTimer -= dt;
        if (impactTimer <= 0) impactElement.classList.add('hidden');
      }

      if (playerBody.position.y < -10 || Math.abs(playerBody.position.x) > 390 || Math.abs(playerBody.position.z) > 390) resetPlayer();
      renderer.render(scene, camera);
    }

    resetPlayer();
    camera.position.set(5.8, 8, -243.5);
    cameraTarget.copy(playerBody.position);
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
